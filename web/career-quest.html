<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャリアクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Lexend:wght@500;600;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E3%81%84%E3%81%84%E3%81%AD%E6%B8%88%EF%BC%81%E7%A4%BE%E9%95%B7&display=swap" rel="stylesheet">
<style>
:root{
  /* 方眼の手帳に、青のボールペンと黄色の蛍光ペン。期間は手帳の見出しタブの色、達成は朱の判子。表紙はキャンパスノートの青。 */
  --paper:#f2f3ee;
  --grid:rgba(28,34,48,.075);
  --card:#ffffff;
  --ink:#1c2230;
  --muted:#4f5767;
  --line:#d6d9cf;
  --accent:#2f45d8;
  --accent-soft:#e8ecfd;
  --mark:#ffe55c;
  --mk:52%;
  --on-accent:#ffffff;
  --shu:#d13c2b;
  --shu-soft:#fbe6e2;
  --hero:#2638b8;
  --on-hero:#f4f6ff;
  --spark:#ffe55c;
  --t-d:#13895a;
  --t-w:#0a7cbd;
  --t-m:#7a43c4;
  --t-y:#c27606;
  --life:#0b8079;
  --career:#34479e;
  --common:#b9520f;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --num:"Lexend","BIZ UDPGothic","Hiragino Sans",sans-serif;
  --brush:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141b; --grid:rgba(255,255,255,.045); --card:#1a1f29; --ink:#eef0f5; --muted:#aeb5c3; --line:#2e3542;
    --accent:#8291ff; --accent-soft:#262d55; --on-accent:#0f1430; --mark:#c9a91f; --mk:80%; --shu:#ff6a55; --shu-soft:#3b2326; --hero:#2a3596; --on-hero:#f4f6ff; --spark:#ffe55c;
    --t-d:#3cc488; --t-w:#3eaee8; --t-m:#b28af0; --t-y:#efa83a; --life:#3fc7be; --career:#9aa8ff; --common:#f29a5a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141b; --grid:rgba(255,255,255,.045); --card:#1a1f29; --ink:#eef0f5; --muted:#aeb5c3; --line:#2e3542;
  --accent:#8291ff; --accent-soft:#262d55; --on-accent:#0f1430; --mark:#c9a91f; --mk:80%; --shu:#ff6a55; --shu-soft:#3b2326; --hero:#2a3596; --on-hero:#f4f6ff; --spark:#ffe55c;
  --t-d:#3cc488; --t-w:#3eaee8; --t-m:#b28af0; --t-y:#efa83a; --life:#3fc7be; --career:#9aa8ff; --common:#f29a5a;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
h1,h2,h3,h4{text-wrap:balance}

.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:var(--paper)}
.logo{font-family:var(--display);font-size:18px;letter-spacing:.02em;line-height:1;font-weight:700}
.logo b{color:var(--accent);font-weight:400}
.mode{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--t-d)}
.mode.local i{background:var(--muted)}
.view{display:grid;gap:24px;padding-top:4px}

/* 冒険者証 */
.badge{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--hero);color:var(--on-hero);border-radius:var(--r);padding:14px 16px}
.badge-av{font-size:32px;width:56px;height:56px;display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:12px}
.badge-name{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;line-height:1.3}
.badge-name .lv{font-family:var(--num);font-size:13px;color:var(--spark);font-weight:600}
.badge-type{font-size:13px;opacity:.85}
.xp{height:6px;background:rgba(255,255,255,.16);border-radius:4px;overflow:hidden;margin-top:8px}
.xp i{display:block;height:100%;background:var(--spark);border-radius:4px}
.xp-cap{font-size:11.5px;opacity:.8;margin-top:3px}
.badge-pts{text-align:right}
.badge-pts b{font-family:var(--num);font-size:24px;font-variant-numeric:tabular-nums;display:block;line-height:1.1;font-weight:600}
.badge-pts span{font-size:11.5px;opacity:.8}

/* 任務 */
.tier-h{display:grid;gap:6px;margin:0 0 12px}
.tier-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tier-h h2{font-family:var(--display);font-size:21px;margin:0;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:8px}
.tier-h h2::before{content:"";width:10px;height:22px;border-radius:3px;background:var(--tc)}
.tier-h h2 em{font-style:normal;color:var(--tc)}
.tier-done{font-size:13px;font-weight:700;color:var(--tc);white-space:nowrap}
.tier-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tier-bar i{display:block;height:100%;background:var(--tc);border-radius:3px}
.tier-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tier-meta b{color:var(--tc)}
.cards{display:grid;gap:10px}
.quest{position:relative;display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:var(--r);padding:14px 14px 12px;min-width:0}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.q-title{margin:0;font-size:17px;font-weight:700;line-height:1.55;overflow-wrap:anywhere;text-wrap:pretty}
.q-cmt{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6;display:flex;gap:8px;align-items:baseline}
.q-cmt span{flex:none;font-size:11.5px;color:var(--tc);font-weight:700;border:1px solid currentColor;border-radius:6px;padding:0 6px;line-height:1.6}
.q-pts{font-family:var(--num);font-size:22px;color:var(--tc);font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;flex:none;font-weight:600}
.q-pts small{font-size:12px;margin-left:2px}
.q-act{display:flex;align-items:center;gap:8px;margin-top:2px}
.q-act .btn-report{flex:1}
.q-del{appearance:none;flex:none;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:10px 4px}
.merit{--gc:var(--muted);display:grid;gap:1px;font-size:14px;line-height:1.55;background:color-mix(in srgb,var(--gc) 9%,var(--card));border-radius:10px;padding:9px 11px}
.merit span{font-size:11.5px;font-weight:700;color:var(--gc)}
.merit span~span{margin-top:5px}
.merit.career{--gc:var(--career)}
.merit.life{--gc:var(--life)}
.merit.common{--gc:var(--common)}
.trio{display:grid;gap:8px}
.trio-i{--gc:var(--muted);display:grid;grid-template-columns:5.2em 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.trio-i b{color:var(--gc);font-size:14px}
.trio-i.career{--gc:var(--career)}
.trio-i.common{--gc:var(--common)}
.trio-i.life{--gc:var(--life)}
.strengths{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.strengths h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px}
.strengths h3 small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);margin-top:2px}
.strengths h4{margin:0;font-size:12px;color:var(--gc)}
.str-g{--gc:var(--muted);display:grid;gap:4px}
.str-g.career{--gc:var(--career)}
.str-g.common{--gc:var(--common)}
.str-g.life{--gc:var(--life)}
.str-g ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.str-g li{font-size:13px;border:1px solid color-mix(in srgb,var(--gc) 45%,var(--line));border-radius:8px;padding:3px 9px;line-height:1.5}
.str-g li em{font-style:normal;color:var(--gc);font-weight:700;margin-left:4px;font-size:11.5px}
.btn-report{appearance:none;border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px}
.btn-report:hover{filter:brightness(1.12)}
.btn-report:disabled{opacity:.4;cursor:not-allowed}
.q-done{flex:1;font-size:13.5px;font-weight:700;color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--card));border-radius:10px;padding:10px 12px}
.quest.is-done .q-title,.quest.is-done .q-cmt,.quest.is-done .merit,.quest.is-done .lnk{opacity:.55}
.quest .hanko{position:absolute;right:12px;top:44px;width:54px;height:54px;font-size:23px}

/* 判子 */
.hanko{width:60px;height:60px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--brush);font-size:26px;line-height:1;transform:rotate(-14deg);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4.5px var(--accent);pointer-events:none;background:color-mix(in srgb,var(--card) 70%,transparent)}
.hanko.big{width:150px;height:150px;border-width:6px;font-size:38px;box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 8px var(--shu)}
.hanko.big span{writing-mode:vertical-rl;letter-spacing:0;white-space:nowrap;line-height:1}
.stamp-in{animation:stamp .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes stamp{0%{transform:scale(2.6) rotate(-4deg);opacity:0}55%{transform:scale(.9) rotate(-14deg);opacity:1}75%{transform:scale(1.04) rotate(-14deg)}100%{transform:scale(1) rotate(-14deg);opacity:.95}}
.thump{animation:thump .35s .3s ease-out both}
@keyframes thump{0%{transform:translateY(0)}30%{transform:translateY(5px)}100%{transform:translateY(0)}}

/* ボタン類 */
.btn-primary{appearance:none;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;width:100%}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn-ghost{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn-ghost:hover{border-color:var(--ink)}
.linkbtn{appearance:none;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:0;justify-self:start}

/* ナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.nav button{appearance:none;background:none;border:0;padding:8px 0 9px;display:grid;justify-items:center;gap:1px;font-size:11.5px;color:var(--muted);font-weight:500}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);font-weight:700}

/* ランキング */
.seg{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:3px}
.seg button{appearance:none;border:0;background:none;padding:9px 0;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--tc);color:#fff}
.rank-cap{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.rank-cap h2{margin:0;font-family:var(--display);font-weight:700;font-size:19px}
.rank-cap span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-t{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;color:var(--muted)}
.chip-t[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px}
.pod{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;display:grid;gap:3px;justify-items:center;min-width:0}
.pod.p1{padding-top:20px;border:2px solid var(--t-y)}
.pod.empty{visibility:hidden}
.pod .rk{font-family:var(--num);font-size:26px;line-height:1;font-weight:600}
.pod.p1 .rk{color:var(--t-y);font-size:34px}
.pod .rk small{font-size:12px}
.pod .av{font-size:30px;line-height:1.2}
.pod .nm{font-weight:700;font-size:13.5px;max-width:100%;overflow-wrap:anywhere;line-height:1.35}
.pod .pt{font-family:var(--num);font-size:16px;color:var(--tc);font-variant-numeric:tabular-nums;font-weight:600}
.rows{display:grid;gap:6px}
.row{appearance:none;display:grid;grid-template-columns:34px 34px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.row.me{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row .rk{font-family:var(--num);font-size:16px;text-align:center;font-weight:600}
.row .av{font-size:24px;text-align:center}
.row .nm{font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.row .sub{font-size:11.5px;color:var(--muted);display:block;font-weight:400}
.row .pt{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--tc);white-space:nowrap;font-weight:600}
.row .pt small{font-size:11px}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:999px;border:1px solid currentColor;margin-left:6px;font-weight:700;line-height:1.6;vertical-align:1px;white-space:nowrap}
.tag.scout{color:var(--shu)}
.tag.sample{color:var(--muted)}
.pinned{font-size:12px;color:var(--muted);margin:2px 0 -2px}

/* 実績書（履歴書） */
.resume{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.resume-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1.5px solid var(--ink)}
.resume-h h2{font-family:var(--display);font-size:20px;letter-spacing:.35em;margin:0;font-weight:700}
.resume-h .asof{font-size:12px;color:var(--muted)}
.resume table{width:100%;border-collapse:collapse;font-size:13.5px}
.resume th{width:8.6em;white-space:nowrap;text-align:left;font-weight:500;color:var(--muted);padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;font-size:12px}
.resume td{padding:8px 14px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.resume .nm-row td{font-size:19px;font-weight:700;line-height:1.4}
.resume .nm-row .r-av{margin-right:6px}
.resume-stats{display:grid;grid-template-columns:repeat(4,1fr)}
.resume-stats div{padding:8px 4px;text-align:center;border-right:1px solid var(--line)}
.resume-stats div:last-child{border-right:0}
.resume-stats b{display:block;font-family:var(--num);font-size:16px;color:var(--tc);font-variant-numeric:tabular-nums;line-height:1.3;font-weight:600}
.resume-stats span{font-size:10.5px;color:var(--muted)}
.entries{display:grid;gap:10px}
.entries-h{margin:0;font-family:var(--display);font-weight:700;font-size:17px}
.entry{display:grid;grid-template-columns:1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
/* 写真は扱わないため、以前の .e-photo は使わない */
.e-photo-x{appearance:none;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--paper);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;border:1px solid var(--line);padding:4px;line-height:1.4}
.e-photo-x img{width:96px;height:96px;object-fit:cover;display:block;margin:-4px}
.e-body{min-width:0;display:grid;gap:4px}
.e-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.e-meta b{margin-left:auto;font-family:var(--num);color:var(--tc);font-size:15px;font-weight:600}
.chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--tc);color:#fff;white-space:nowrap}
.entry h4{margin:0;font-size:14.5px;line-height:1.5}
.entry dl{margin:2px 0 0;display:grid;gap:2px;font-size:13px}
.entry dt{font-size:11px;font-weight:700;color:var(--muted)}
.entry dd{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}

.notice{background:var(--card);border:1px dashed var(--muted);border-radius:var(--r);padding:16px;font-size:14px;display:grid;gap:8px}
.notice h3{margin:0;font-size:15px}
.notice p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* マイページ */
.form{display:grid;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.txt{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--paper);font-size:16px}
.txt:focus{border-color:var(--ink);outline:none}
textarea.txt{resize:vertical;min-height:84px;line-height:1.6}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.av-grid button{appearance:none;font-size:26px;aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0;line-height:1}
.av-grid button.sel{border-color:var(--accent);background:var(--accent-soft)}
.switch{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-size:14px}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.switch b{display:block}
.how{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.how li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px}
.how li::before{content:counter(s);font-family:var(--num);width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px;line-height:1;font-weight:600}
.sec-h{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:17px}

/* オーバーレイ */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,13,26,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--card);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px;align-content:start}
@media (min-width:640px){.overlay{align-items:center}.panel{border-radius:20px;max-height:90%}}
.panel-h{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.panel-h h2{margin:4px 0 0;font-size:18px;line-height:1.45}
.x{appearance:none;border:0;background:var(--paper);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center}
.req{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.req span{font-size:12px;text-align:center;padding:6px 4px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted);transition:all .2s}
.req span.ok{border:1.5px solid var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.drop{display:grid;place-items:center;min-height:150px;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;padding:14px;font-size:14px;font-weight:700}
.drop small{display:block;font-weight:400;font-size:12px;margin-top:4px}
.drop:focus-within{border-color:var(--accent)}
.drop input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.drop img{max-height:260px;border-radius:10px;display:block}
.drop.has{border-style:solid;border-color:var(--accent);padding:8px}
.cnt{font-size:11.5px;color:var(--muted);text-align:right}
.cnt.ok{color:var(--t-d);font-weight:700}
.note{font-size:12px;color:var(--muted);margin:0}
.cele{align-items:center}
.cele-card{background:var(--card);border-radius:22px;padding:28px 22px 22px;max-width:360px;width:calc(100% - 32px);display:grid;justify-items:center;gap:8px;text-align:center}
.cele-who{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin:0}
.cele-pts{font-family:var(--num);font-size:46px;color:var(--accent);margin:6px 0 0;line-height:1;font-weight:600}
.cele-pts small{font-size:18px}
.cele-title{font-weight:700;margin:0;line-height:1.5}
.cele-cmt{font-size:13.5px;color:var(--muted);margin:0}
.cele-lv{font-family:var(--num);color:var(--t-y);margin:4px 0 0;font-size:16px;font-weight:600}
.cele-card .btn-primary{margin-top:10px}
.lb{align-items:center;padding:16px}
.lb img{max-height:86vh;border-radius:12px;background:var(--card)}
.dlg-card{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:calc(100% - 32px);display:grid;gap:14px}
.dlg-card p{margin:0}
.dlg-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* ジャンル・マイ任務 */
.gtag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:999px;border:1px solid currentColor;line-height:1.7;white-space:nowrap;font-style:normal}
.gtag.career{color:var(--career)}
.gtag.common{color:var(--common)}
.gtag.life{color:var(--life)}
.gtag.mine{color:var(--accent)}
.q-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);min-width:0}
.qfilter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin:-6px 0 -8px;scrollbar-width:none}
.qfilter::-webkit-scrollbar{display:none}
.qfilter .chip-t{flex:none}
.btn-add{appearance:none;width:100%;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:15.5px;display:grid;gap:2px;text-align:left}
.btn-add small{font-weight:500;font-size:12.5px;color:var(--muted);line-height:1.5}
.btn-add:hover{border-style:solid}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pick{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:12.5px}
.pick:hover{border-color:var(--ink)}
.opt-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt-row.two{grid-template-columns:1fr 1fr}
.opt-row.three{grid-template-columns:repeat(3,1fr)}
.opt{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 2px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.opt.on{border-color:var(--tc);background:var(--tc);color:#fff}
.axis{display:grid;gap:6px}
.axis-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-weight:700}
.axis-h span{font-size:12px;font-weight:500;color:var(--muted);text-align:right}
.lv5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lv5 button{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;font-family:var(--num);font-size:14px;color:var(--muted);font-weight:600}
.lv5 button.in{border-color:var(--accent);color:var(--accent)}
.lv5 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.calc{background:var(--hero);color:var(--on-hero);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.calc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.calc-pts{font-family:var(--num);font-size:36px;line-height:1;color:var(--spark);font-variant-numeric:tabular-nums;font-weight:600}
.calc-pts small{font-size:14px;margin-left:2px}
.calc-f{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums;margin:0}
.calc-cmt{font-size:13px;border-left:2px solid var(--spark);padding-left:9px;margin:0}
.why{margin:0;padding:0;list-style:none;font-size:12px;color:var(--muted);display:grid;gap:2px}
.why li::before{content:"・"}
.warn{font-size:12.5px;background:var(--shu-soft);color:var(--ink);border-radius:10px;padding:8px 10px;margin:0}
.ob-opt.multi::after{border-radius:6px}
.ob-opt small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
.ob-res-i .gtag{margin-right:6px;vertical-align:1px}

/* マイ任務の審査 */
.judge{--gc:var(--muted);border:1px solid var(--line);border-top:3px solid var(--gc);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;background:var(--card)}
.judge.coach{--gc:var(--life)}
.judge.ceo{--gc:var(--career)}
.judge-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.judge-h b{font-size:15px}
.judge-h b small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.judge-h .sc{font-family:var(--num);font-size:26px;color:var(--gc);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.judge-h .sc small{font-size:12px;margin-left:1px}
.crits{display:grid;gap:6px}
.crit{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;font-size:13px}
.crit small{grid-column:1/-1;color:var(--muted);font-size:11.5px;line-height:1.45}
.d3{display:flex;gap:3px}
.d3 i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--gc);opacity:.35}
.d3 i.on{background:var(--gc);opacity:1}
.sus{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.sus.ok{color:var(--t-d)} .sus.heavy{color:var(--t-y)} .sus.over{color:var(--accent)}
.fb{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px;line-height:1.55}
.fb li{padding-left:1.4em;position:relative}
.fb li::before{position:absolute;left:0;top:0;font-weight:700}
.fb .good::before{content:"○";color:var(--t-d)}
.fb .tip::before{content:"→";color:var(--accent)}
.block{background:var(--shu);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;margin:0;line-height:1.55}
.why-d summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:700}
.why-d .why{margin-top:6px}
.rubric{display:grid;gap:12px}
.rubric h3{margin:0;font-size:14px;color:var(--gc)}
.rubric .judge{gap:6px}
.rubric table{width:100%;border-collapse:collapse;font-size:12.5px}
.rubric td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
.rubric td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px;color:var(--gc);font-weight:700}
.rubric td.rsub{color:var(--muted);font-size:11.5px;padding-left:12px;border-top:0;text-align:left;white-space:normal;font-weight:400}

.mseg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
.mseg button{appearance:none;border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.mseg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.cat{flex:none;appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink);display:flex;gap:4px;align-items:center;white-space:nowrap}
.cat[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:340px;overflow:auto;padding:2px;align-content:start}
.act-h{grid-column:1/-1;margin:6px 0 0;font-size:12.5px;font-weight:700;color:var(--muted)}
.act-h:first-child{margin-top:0}
.act-i{appearance:none;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;font-size:14px;font-weight:600;line-height:1.35;display:grid;gap:2px;color:var(--ink)}
.act-i:hover{border-color:var(--ink)}
.act-i small{font-size:12px;font-weight:500;color:var(--muted)}
.chosen{display:flex;gap:10px;align-items:center;border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--paper)}
.chosen .ic{font-size:24px;line-height:1}
.chosen small{display:block;font-size:12px;color:var(--muted)}
.chosen b{display:block;font-size:15.5px;line-height:1.35}
.chosen .linkbtn{margin-left:auto;flex:none}
.hrow{display:grid;gap:6px;margin-top:4px}
.hl{font-size:13px;font-weight:700;color:var(--muted)}
.hopts{display:flex;flex-wrap:wrap;gap:6px}
.ho{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.25;text-align:center}
.ho small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.ho.sm{padding:6px 10px;font-size:12.5px;border-radius:999px}
.ho[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.ho[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.wrow .hl{display:flex;justify-content:space-between;align-items:baseline}
.wheel{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;user-select:none;-webkit-user-select:none;max-width:340px}
.wheel::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:34px;margin-top:-17px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none}
.wcol{position:relative;z-index:1;flex:none;width:72px;height:170px;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;outline:none;border-radius:10px;cursor:ns-resize;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wcol::-webkit-scrollbar{display:none}
.wcol:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.wpad{height:68px}
.wi{height:34px;line-height:34px;text-align:center;scroll-snap-align:center;font-family:var(--num);font-size:21px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.wi.on{color:var(--ink);font-weight:700}
.wu{position:relative;z-index:1;font-size:14px;font-weight:700;color:var(--ink);margin:0 10px 0 0}
.wheel.list{max-width:none}
.wcol.wide{flex:1 1 auto;width:auto;min-width:0;padding:0 14px}
.wcol.wide .wi{font-family:var(--body);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcol.wide.sm .wi{font-size:13.5px;letter-spacing:-.01em}
.wsum{margin:2px 0 0;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.wsum b{font-family:var(--num);font-size:17px;color:var(--ink)}
.wsum small{font-size:12px}
.cg-sub{display:grid;gap:10px}
.at-box{display:grid;gap:6px}
.add-row{display:flex;gap:6px;align-items:center}
.add-row .txt{flex:1;min-width:0;padding:8px 10px;font-size:14px}
.add-row .n-btn{margin-left:0;flex:none;padding:8px 14px;font-size:13px}
.hl small{font-weight:500;color:var(--muted);margin-left:6px;font-size:11.5px}
.wwarn{margin:2px 0 0;font-size:13px;line-height:1.6;border-radius:10px;padding:9px 11px;background:color-mix(in srgb,var(--shu) 10%,var(--card));border:1px solid color-mix(in srgb,var(--shu) 45%,transparent);color:var(--ink)}
.wwarn b{color:var(--shu)}
.wwarn.lv1{background:color-mix(in srgb,var(--mark) 22%,var(--card));border-color:color-mix(in srgb,var(--mark) 70%,transparent)}
.wwarn.lv1 b{color:var(--ink)}
.morebtn{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1.5px dashed var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;color:var(--ink);font-weight:700;font-size:14px}
.morebtn small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.morebtn b{font-size:12px;color:var(--accent);white-space:nowrap}
.more{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lnk{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px 4px 9px;font-size:12.5px;font-weight:700;color:var(--ink);max-width:100%;margin:0;justify-self:start;text-align:left}
.lnk i{width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lnk small{color:var(--muted);font-weight:500;flex:none}
.ch-intro{margin:4px 0 12px}
.chain{background:var(--card);border-radius:var(--r);border:1px solid var(--line);border-top:4px solid var(--cc);padding:14px 14px 12px;margin:0 0 14px;scroll-margin-top:72px;transition:box-shadow .3s}
.chain.flash{box-shadow:0 0 0 3px var(--cc)}
.chain.loose{border-top-color:var(--line)}
.chain-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.chain-h .cdot{width:12px;height:12px;border-radius:50%;background:var(--cc);flex:none}
.chain-h b{display:block;font-size:15px;line-height:1.35}
.chain-h small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.cprog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 12px}
.cprog span{height:6px;border-radius:3px;background:var(--line)}
.cprog span.on{background:var(--cc)}
.flow{list-style:none;margin:0;padding:0}
.node{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
.n-tier{display:grid;justify-items:center;gap:2px;padding-top:4px}
.n-tier b{display:block;width:100%;text-align:center;background:var(--tc);color:#fff;border-radius:8px;font-size:12px;padding:4px 0;font-weight:700}
.n-tier small{font-size:11px;color:var(--muted)}
.n-body{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--paper);min-width:0}
.node.done .n-body{border:1.5px solid var(--cc)}
.node.empty .n-body{border-style:dashed;background:none}
.node.empty .n-title{color:var(--muted);font-weight:500}
.n-title{text-wrap:pretty;margin:0 0 6px;font-size:14.5px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.n-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.n-pts{font-family:var(--num);font-size:15px;line-height:1;font-weight:600}
.n-pts small{font-size:10px;margin-left:1px}
.n-kind{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px}
.n-done{color:#fff;background:var(--cc);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:auto}
.n-btn{appearance:none;margin-left:auto;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.n-more{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.conn{display:grid;grid-template-columns:62px 1fr;gap:10px;height:28px}
.conn::before{content:"";justify-self:center;width:2px;height:100%;background:var(--cc);opacity:.55}
.conn span{align-self:center;font-size:12px;color:var(--muted)}
.flow-foot{margin:10px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.loose-l{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.loose-l li{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:13px}
.loose-l b{background:var(--tc);color:#fff;border-radius:7px;font-size:11px;text-align:center;padding:3px 0}
.loose-l small{color:var(--muted)}
.plan{border:1.5px solid var(--ink);border-radius:14px;padding:12px;display:grid;gap:8px}
.plan-h b{display:block;font-size:14.5px}
.plan-h small{display:block;color:var(--muted);font-size:12px}
.ladder{list-style:none;margin:0;padding:0}
.rw{display:grid;grid-template-columns:20px 62px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
label.rw{cursor:pointer}
.rw.me{border:1.5px solid var(--accent);background:var(--accent-soft)}
.rw.none{opacity:.7}
.rw .mk{color:var(--accent);font-size:13px;text-align:center}
.rw .tc{background:var(--tc);color:#fff;border-radius:7px;font-size:11px;font-weight:700;text-align:center;padding:3px 0}
.rw b{display:block;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.rw small{display:block;font-size:12px;color:var(--muted)}
.rw input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.rw-wrap{display:flex;gap:6px;align-items:stretch}
.rw-wrap>.rw{flex:1;min-width:0}
.rw-ed{appearance:none;flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 10px;font-size:12.5px;font-weight:700;min-width:56px}
.rw-ed:hover,.rw-ed[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.rung-ed{margin:6px 0 2px;border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;display:grid;gap:10px;background:var(--card)}
.rung-ed .field{margin:0}
.rung-ed-f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rung-c{height:18px;display:grid;grid-template-columns:20px 62px;gap:8px;padding:0 10px;font-size:10px;color:var(--muted)}
.rung-c span{grid-column:2;text-align:center;line-height:18px}
#cg-save small{display:block;font-size:12px;font-weight:500;opacity:.9;margin-top:1px}
.toast{display:flex;align-items:center;gap:12px}
.toast-act{appearance:none;border:0;background:none;color:var(--spark);font-weight:700;font-size:13.5px;padding:2px 0;text-decoration:underline;flex:none}
.n-del{appearance:none;border:0;background:none;color:var(--muted);font-size:11.5px;text-decoration:underline;padding:4px 2px}
.c-del{margin-left:auto;flex:none;align-self:flex-start}
.removed{margin:6px 0 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 14px}
.removed summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted)}
.removed .loose-l{margin-top:10px}
.ob-conn{margin:-2px 0 -2px 10px;font-size:11px;color:var(--muted)}

/* ---------- 手帳スタイル（方眼・ボールペンの青・蛍光ペン） ---------- */
body{background-color:var(--paper);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.3px);background-size:18px 18px;background-attachment:fixed;font-size:15.5px;line-height:1.7}
.top{background:color-mix(in srgb,var(--paper) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.logo{font-weight:900;font-size:19px;letter-spacing:.01em}
.logo b{color:var(--ink);font-weight:900;background:linear-gradient(transparent var(--mk),var(--mark) var(--mk),var(--mark) 94%,transparent 94%);padding:0 2px}
.ob-logo{font-weight:900;letter-spacing:-.01em}
.ob-logo span{color:var(--ink);background:linear-gradient(transparent var(--mk),var(--mark) var(--mk),var(--mark) 92%,transparent 92%);padding:0 4px}
.sec-h{display:inline-block;font-size:18px;background:linear-gradient(transparent max(var(--mk),60%),var(--mark) max(var(--mk),60%),var(--mark) 94%,transparent 94%);padding:0 3px}
/* 表紙（冒険者証）：キャンパスノートの青 */
.badge{background:var(--hero);color:var(--on-hero);box-shadow:inset 7px 0 0 rgba(0,0,0,.22),0 6px 18px -8px color-mix(in srgb,var(--hero) 70%,transparent);padding-left:20px}
.badge-av{background:rgba(255,255,255,.14);border-radius:14px}
.badge-pts b{font-size:26px}
/* 期間の見出し：手帳のインデックスタブ */
.tier-h h2::before{content:none}
.tier-h h2{font-size:20px;gap:10px}
.tier-h h2 em{font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.02em;background:var(--tc);color:#fff;border-radius:9px 9px 9px 3px;padding:3px 12px 4px;line-height:1.3}
.tier-bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--tc) 14%,var(--card))}
/* カード */
.quest,.chain,.notice,.strengths,.sugg{box-shadow:0 1px 0 rgba(28,34,48,.05),0 6px 16px -12px rgba(28,34,48,.25)}
.quest{border-left-width:6px;border-radius:12px}
.btn-report{background:var(--accent);color:var(--on-accent);border-radius:12px}
.btn-report:hover{filter:brightness(1.08)}
.btn-primary{color:var(--on-accent);border-radius:14px;box-shadow:0 6px 16px -10px var(--accent)}
.chip-t[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.btn-add{border-style:dashed;border-width:2px;background:var(--accent-soft);color:var(--accent)}
.btn-add small{color:var(--muted)}
.q-pts{font-size:23px;letter-spacing:-.01em}
/* ナビ：選んでいる画面に青い下地 */
.nav{box-shadow:0 -6px 18px -14px rgba(28,34,48,.4)}
.nav button{position:relative;color:var(--muted)}
.nav button.on{color:var(--accent)}
.nav button.on svg{background:var(--accent-soft);border-radius:999px;padding:3px 14px;width:52px;height:30px;margin:-3px 0}
/* 判子は朱のまま */
.hanko{color:var(--shu);border-color:var(--shu)}
.ho[aria-pressed="true"],.lv5 button.on,.ob-opt.sel::after{color:var(--on-accent)}
.ho[aria-pressed="true"] small{color:inherit;opacity:.85}
</style>
</head>

   成長スコア（100点）と実績スコア（100点）で採点する。（データ上の名前は coach＝成長スコア、ceo＝実績スコア）
   成長スコア：成長負荷40／目標の質25／自信につながる度15／動機10／続ける仕組み5／あなたとの相性5／減点
   実績スコア：仕事で使える力25／成果と証明25／他者への価値20／主体性15／希少性10／志望との一致5
   総合点 = 成長スコア×重み + 実績スコア×重み（キャリア 45:55 ／ 共通 60:40 ／ 自分磨き 75:25）
   ポイント = 期間の基本点 × 倍率、倍率 = 0.5 + 2.0 × 総合点 ÷ 100（0.5〜2.5倍） */

const TIER_RANK = {daily:0, weekly:1, monthly:2, yearly:3};

function cap(v, mx){ return Math.max(0, Math.min(mx, v)); }
function tierOfDays(n){ return n <= 1 ? 'daily' : n <= 7 ? 'weekly' : n <= 31 ? 'monthly' : 'yearly'; }
function bigger(a, b){ return !a ? b : !b ? a : (TIER_RANK[a] >= TIER_RANK[b] ? a : b); }
function upTier(t){ return TIERS[Math.min(3, TIER_RANK[t] + 1)]; }

/* 漢数字・全角を数字に */
function kanjiNum(str){
  const D = {'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  let total = 0, cur = 0;
  for (const ch of str){
    if (ch in D) cur = D[ch];
    else if (ch === '十'){ total += (cur || 1) * 10; cur = 0; }
    else if (ch === '百'){ total += (cur || 1) * 100; cur = 0; }
    else if (ch === '千'){ total += (cur || 1) * 1000; cur = 0; }
  }
  return total + cur;
}
function normGoal(t){
  let s = String(t || '').replace(/[０-９Ａ-Ｚａ-ｚ％．＋]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/[\s　]+/g, '');
  s = s.replace(/[〇一二三四五六七八九十百千]+(?=(分|時間|日|週間|週|ヶ月|か月|カ月|ヵ月|年|回|本|冊|人|名|件|km|キロ|ページ|問|kg|円|万|つ|個|品|社|枚|曲|食|杯|歩|時))/g, m => String(kanjiNum(m)));
  return s;
}
function first(s, re){ const m = s.match(re); return m ? m[0] : ''; }

/* 難易度の段階：級・点数・記録・回数・時刻・金額・人数などから、挑戦度などを細かく決める */
function levelRules(s, P){
  const L = {cSet:0, eSet:0, eMin:0, dSet:0, exam:0, scaleMin:'', rare:false, notes:[]};
  const setC = (v, note, rare) => { if (v > L.cSet) L.cSet = v; L.notes.push(note + '＝挑戦' + v); if (rare) L.rare = true; };
  const setExam = (v, note, rare) => { setC(v, note, rare); L.exam = Math.max(L.exam, v); L.scaleMin = bigger(L.scaleMin || null, v >= 5 ? 'yearly' : v >= 3 ? 'monthly' : 'weekly'); };
  let m;
  if ((m = s.match(/英検(準)?([1-5])級/))){ const g = +m[2], pre = !!m[1]; setExam(g === 1 ? (pre ? 4 : 5) : g === 2 ? 3 : g === 3 ? 2 : 1, '英検' + (pre ? '準' : '') + g + '級', g === 1 && !pre); }
  if ((m = s.match(/簿記([1-3])級/))){ const g = +m[1]; setExam(g === 1 ? 5 : g === 2 ? 4 : 2, '簿記' + g + '級', g === 1); }
  if ((m = s.match(/(?:漢検|漢字検定)(準)?(\d{1,2})級/))){ const g = +m[2], pre = !!m[1]; setExam(g === 1 ? (pre ? 4 : 5) : g <= 2 ? 3 : 2, '漢検' + (pre ? '準' : '') + g + '級', g === 1 && !pre); }
  if ((m = s.match(/FP([1-3])級/i))){ const g = +m[1]; setExam(g === 1 ? 5 : g === 2 ? 3 : 2, 'FP' + g + '級', g === 1); }
  if (/ITパスポート/i.test(s)) setExam(2, 'ITパスポート');
  if (/基本情報/.test(s)) setExam(3, '基本情報技術者');
  if (/応用情報/.test(s)) setExam(4, '応用情報技術者');
  if ((m = s.match(/(情報処理安全確保|ネットワークスペシャリスト|データベーススペシャリスト|システムアーキテクト|ITストラテジスト|プロジェクトマネージャ試験)/))) setExam(5, m[1], true);
  if ((m = s.match(/(宅建|宅地建物取引士|行政書士|日商簿記2級|秘書検定1級)/))) setExam(4, m[1]);
  if ((m = s.match(/(社労士|社会保険労務士|中小企業診断士|司法書士|税理士|公認会計士|司法試験|弁理士|不動産鑑定士|医師国家試験|弁護士)/))) setExam(5, m[1], true);
  if ((m = s.match(/TOEIC.{0,8}?(\d{3,4})/i))){ const sc = +m[1]; setExam(sc >= 860 ? 5 : sc >= 730 ? 4 : sc >= 600 ? 3 : 2, 'TOEIC' + sc + '点', sc >= 900); }
  if ((m = s.match(/TOEFL.{0,8}?(\d{2,3})/i))){ const sc = +m[1]; setExam(sc >= 100 ? 5 : sc >= 80 ? 4 : sc >= 60 ? 3 : 2, 'TOEFL' + sc + '点', sc >= 100); }
  if ((m = s.match(/IELTS.{0,8}?(\d(?:\.\d)?)/i))){ const sc = +m[1]; setExam(sc >= 7 ? 5 : sc >= 6 ? 4 : sc >= 5 ? 3 : 2, 'IELTS' + sc, sc >= 7.5); }
  if ((m = s.match(/(\d+)点(?:アップ|上げ|伸ば)/))){ const n = +m[1]; setC(n >= 200 ? 5 : n >= 100 ? 4 : 3, n + '点アップ'); }
  if ((m = s.match(/サブ(\d(?:\.\d)?)/))){ const h = +m[1]; setC(5, 'マラソンのサブ' + h, h <= 3.5); L.eMin = 5; }
  if ((m = s.match(/(\d+(?:\.\d+)?)km(?:の)?(?:レース|大会|マラソン)/))){ const k = +m[1]; if (k < 42) setC(k >= 21 ? 4 : k >= 10 ? 3 : 2, k + 'kmのレース'); }
  if ((m = s.match(/懸垂.{0,6}?(\d+)回/))){ const n = +m[1]; L.eSet = n >= 15 ? 5 : n >= 10 ? 4 : n >= 5 ? 3 : 2; L.notes.push('懸垂' + n + '回＝負荷' + L.eSet); }
  else if ((m = s.match(/(腕立て|腹筋|スクワット|バーピー).{0,6}?(\d+)回/))){ const n = +m[2], k = m[1] === 'スクワット' ? 1.5 : m[1] === 'バーピー' ? 0.4 : 1; const a = n / k; L.eSet = a >= 150 ? 5 : a >= 100 ? 4 : a >= 50 ? 3 : a >= 20 ? 2 : 1; L.notes.push(m[1] + n + '回＝負荷' + L.eSet); }
  if ((m = s.match(/プランク.{0,6}?(\d+)(秒|分)/))){ const sec = +m[1] * (m[2] === '分' ? 60 : 1); L.eSet = sec >= 180 ? 4 : sec >= 90 ? 3 : 2; L.notes.push('プランク' + sec + '秒＝負荷' + L.eSet); }
  if ((m = s.match(/(?:^|[^\d])([3-7])時(?:半)?(?:に)?起/))){ const h = +m[1]; L.dSet = h <= 4 ? 5 : h === 5 ? 4 : h === 6 ? 3 : 2; L.notes.push(h + '時起き＝自制' + L.dSet); }
  if (P.acts.some(a => a.stop)){
    if (P.total0 || /(断つ|断ち|禁酒|禁煙|断酒|やめる|一切|完全)/.test(s)){ L.notes.push('完全にやめる＝自制5'); L.dSet = Math.max(L.dSet, 5); }
    else if (/(以内|減らす|控え|休肝日|週\d日)/.test(s)){ L.dSet = Math.max(L.dSet, 4); L.notes.push('量を減らす＝自制4'); }
  }
  if (P.yen){
    const y = P.yen;
    if (/(貯金|貯め|積立|つみたて|節約)/.test(s)){ const v = y >= 50000 ? 5 : y >= 30000 ? 4 : 3; L.dSet = Math.max(L.dSet, v); L.notes.push(Math.round(y / 1000) / 10 + '万円＝自制' + v); if (y >= 1000000) L.rare = true; }
    if (/(売上|稼|収益|報酬|受注|利益)/.test(s)){ setC(y >= 100000 ? 5 : 4, Math.round(y / 1000) / 10 + '万円の売上', y >= 1000000); }
  }
  if (P.people && /(集め|集客|前で|参加者|登壇|講演|動員)/.test(s)){ const n = P.people; setC(n >= 100 ? 5 : n >= 30 ? 4 : n >= 5 ? 3 : 2, n + '人', n >= 100); }
  if ((m = s.match(/(\d+)(?:人)?(?:の)?(?:フォロワー|ユーザー|登録者|読者)/) || s.match(/(?:フォロワー|ユーザー|登録者|読者)(?:数)?(?:を|が)?(\d+)/))){ const n = +m[1]; setC(n >= 10000 ? 5 : n >= 1000 ? 4 : n >= 100 ? 3 : 2, n + '人のフォロワー・ユーザー', n >= 10000); L.scaleMin = bigger(L.scaleMin || null, n >= 10000 ? 'yearly' : n >= 300 ? 'monthly' : 'weekly'); }
  if (/(海外|外国)/.test(s) && /(1人で|一人で|ひとりで|一人旅|ひとり旅)/.test(s)) setC(5, '海外ひとり旅', true);
  if (/(留学|ワーホリ|ワーキングホリデー|海外移住|海外で働)/.test(s)){ setC(5, '海外で暮らす', true); L.eMin = Math.max(L.eMin, 5); }
  if ((m = s.match(/(富士山|北アルプス|槍ヶ岳|百名山|雪山)/))){ setC(5, m[1], true); L.eMin = 5; }
  else if (/(高尾山|低山|ハイキング)/.test(s)){ L.eSet = 3; if (!L.cSet) L.cSet = 2; L.notes.push('低い山＝負荷3・挑戦2'); }
  if (/(ビジネスレベル|商談で使える|通訳)/.test(s)){ setC(4, 'ビジネスレベルの語学'); L.scaleMin = 'yearly'; }
  if (/(ネイティブ|字幕なし|同時通訳)/.test(s)){ setC(5, 'ネイティブ級の語学', true); L.scaleMin = 'yearly'; }
  if (/(初売上|はじめての売上|初めての売上|初受注)/.test(s)) setC(4, '初めての売上');
  return L;
}

/* 目標の文章を読み取る */
function analyzeGoal(text){
  const s = normGoal(text);
  const P = {text:s, acts:[]};
  // 活動
  ACT.forEach(a => {
    const m = s.match(a.re); if (!m) return;
    if (a.stop){
      const near = s.slice(m.index, m.index + m[0].length + 16);
      const negRe = /(しない|やめ|止め|断つ|断ち|触らない|さわらない|見ない|開かない|使わない|飲まない|吸わない|食べない|買わない|控え|減らす|以内|禁止|オフ|OFF|消す|我慢|抜き|ゼロ|言わない|休む|しません)/i;
      if (!negRe.test(near) && !(a.self && a.self.test(s))) return;
    }
    P.acts.push(Object.assign({hit:m[0]}, a));
  });
  // 量
  const f = re => { const m = s.match(re); return m ? parseFloat(m[1]) : 0; };
  const hours = f(/(\d+(?:\.\d+)?)時間(?!後|前)/);
  const mins = f(/(\d+)分(?!の|前|後)/);
  P.sessionMin = hours * 60 + (hours && mins < 60 ? mins : (hours ? 0 : mins));
  P.km = f(/(\d+(?:\.\d+)?)(?:km|キロメートル|キロ)(?!グラム|g|痩|やせ|減|太|落)/i);
  P.kg = f(/(\d+(?:\.\d+)?)(?:kg|キログラム|キロ)(?=.{0,6}(?:痩|やせ|減|落と|ダイエット))/i) || (/(痩|やせ|減量|ダイエット)/.test(s) ? f(/(\d+(?:\.\d+)?)kg/i) : 0);
  P.pages = f(/(\d+)ページ/); P.books = f(/(\d+)冊/); P.problems = f(/(\d+)問/);
  P.steps = f(/(\d+(?:\.\d+)?)万歩/) * 10000 || f(/(\d{3,})歩/);
  const ym = s.match(/(\d+(?:\.\d+)?)(万)?円/); P.yen = ym ? parseFloat(ym[1]) * (ym[2] ? 10000 : 1) : 0;
  P.people = f(/(\d+)(?:人|名)(?!で|きり)/);
  P.score = f(/(\d+)点/);
  P.pieces = f(/(\d+)(?:本|つ|個|件|品|社|枚|曲|作品|記事|行|語)/);
  P.bigCount = f(/(\d+)(?:本|件|作品|記事|社|曲)/);
  P.pct = f(/(\d+)(?:%|％|割)/);
  // 頻度
  let fw = 0, m;
  if (/(毎日|毎朝|毎晩|毎夜|日課|欠かさず)/.test(s)) fw = 7;
  else if (/平日/.test(s)) fw = 5;
  else if (/(隔日|1日おき)/.test(s)) fw = 3.5;
  if ((m = s.match(/週(?:に)?(\d+)(?:回|日)/))) fw = +m[1];
  else if (!fw && /(毎週|週1|週一)/.test(s)) fw = 1;
  if (!fw && (m = s.match(/月(?:に)?(\d+)(?:回|日)/))) fw = +m[1] / 4.3;
  else if (!fw && /毎月/.test(s)) fw = 0.25;
  P.freqWeek = fw;
  P.perDay = (m = s.match(/(?:1日|毎日)(\d+)回/)) && +m[1] <= 10 ? +m[1] : 0;
  const s2 = s.replace(/週(?:に)?\d+(?:回|日)|月(?:に)?\d+(?:回|日)|(?:1日|毎日)\d+回/g, '');
  P.reps = (m = s2.match(/(\d+)回/)) ? +m[1] : 0;
  // 続ける期間
  let days = 0;
  if ((m = s2.match(/(\d+)日間/)) || (m = s2.match(/(\d+)日(?:連続|続け|継続)/))) days = +m[1];
  else if ((m = s2.match(/(\d+)日(?!まで|に|から|目)/)) && +m[1] >= 2 && !/\d+月\d+日/.test(s2)) days = +m[1];
  if ((m = s2.match(/(\d+)週間/))) days = Math.max(days, +m[1] * 7);
  if ((m = s2.match(/(\d+)(?:ヶ月|か月|カ月|ヵ月|ケ月)(?!以内|後)/))) days = Math.max(days, +m[1] * 30);
  if ((m = s2.match(/(\d{1,2})年間/)) || (m = s2.match(/(\d{1,2})年(?:続|継続|かけ)/))) days = Math.max(days, +m[1] * 365);
  if (/(一年中|1年中|一年間|年間通して)/.test(s)) days = Math.max(days, 365);
  if (/半年/.test(s)) days = Math.max(days, 180);
  P.days = days;
  // 「月に4冊」「週に2本」のような、期間ごとの数の目標
  P.countTier = /週(?:に)?\d+(?:冊|本|件|記事|作品|社|人|曲)/.test(s) ? 'weekly' : /月(?:に)?\d+(?:冊|本|件|記事|作品|社|人|曲)/.test(s) ? 'monthly' : /年(?:に|で)?\d+(?:冊|本|件|記事|作品|社|人|曲)/.test(s) ? 'yearly' : '';
  // 期限
  let dl = '', dlw = '';
  if ((dlw = first(s, /(今日|今夜|今晩)/))) dl = 'daily';
  else if ((dlw = first(s, /(今週|週末まで|今週中)/))) dl = 'weekly';
  else if ((dlw = first(s, /(今月|月末まで|月内)/))) dl = 'monthly';
  else if ((dlw = first(s, /(今年|年内|年末まで|1年以内|来年まで|来年\d+月)/))) dl = 'yearly';
  else if ((m = s.match(/(\d{1,2})月(?:末|中|まで|いっぱい)/))){ dlw = m[0]; dl = (+m[1] === new Date().getMonth() + 1) ? 'monthly' : 'yearly'; }
  else if ((m = s.match(/(\d+)(?:ヶ月|か月|カ月)以内/))){ dlw = m[0]; dl = +m[1] <= 1 ? 'monthly' : 'yearly'; }
  P.deadline = dl; P.deadlineWord = dlw;
  // 目標の長さ（日数）：続ける期間、または「3ヶ月以内」のような期限
  P.horizon = days >= 2 ? days : ((m = s.match(/(\d+)(?:ヶ月|か月|カ月)以内/)) ? +m[1] * 30 : 0);
  // 仕組み・ハードル・注意
  P.trigger = first(s, /(朝起きたら|起きたら|朝一番|朝イチ|出勤前|通勤中|通勤時間|昼休み|仕事終わり|帰宅後|帰ったら|夕食後|食後|お風呂の後|風呂上がり|お風呂上がり|寝る前|就寝前|毎朝|毎晩|朝に|夜に|[月火水木金土日]曜)/);
  P.support = first(s, /(仲間と|一緒に|友達と|友人と|家族と|宣言|SNSで報告|記録する|記録して|アプリで記録|パートナーと|コーチと)/);
  P.place = first(s, /(家で|自宅で|ジムで|カフェで|図書館で|会社で|職場で|公園で|駅まで|通勤中に|電車で|ベッドで|机で|近所を|川沿いを|プールで)/);
  P.ifthen = first(s, /(できない日は|雨の日は|最低|だけでも|忙しい日は|疲れた日は|できなかったら|休んだら)/);
  P.firstW = first(s, /(初めて|はじめて|人生初|未経験|初挑戦|デビュー)/);
  P.alone = first(s, /(1人で|一人で|ひとりで|単独|ソロ)/);
  P.publicW = first(s, /(人前|みんなの前|大勢の前|\d{2,}人の前|登壇|ステージ|生配信|発表)/);
  P.compete = first(s, /(大会|コンテスト|コンクール|オーディション|選考|審査|試験|面接)/);
  P.money = first(s, /(お金をもらう|有料|売上|契約|受注|報酬|収益)/);
  P.total0 = first(s, /(一切|完全に|ゼロ|0回|1回も|絶対に)/);
  P.hardship = first(s, /(雨の日も|休日も|疲れても|飲み会でも|旅行中も|土日も)/);
  P.early = /(?:^|[^\d])[3-5]時(?:半)?(?:に)?起/.test(s);
  P.vague = first(s, /(頑張る|がんばる|意識する|なるべく|できるだけ|気をつける|心がける|ちゃんと|しっかり|もっと|色々|いろいろ|何か|なにか|努力する|成長する|変わる|向上させ|ようにする|ようになる|いい感じ|それなり)/);
  P.result = first(s, /(\d+点(?:を取|以上|突破)|スコア|完成|公開|リリース|出品|合格|取得|完走|完泳|完遂|達成|優勝|入賞|入選|契約|受注|出版|内定|昇進|昇格|受賞|登頂|開催|実施|提出|修了|卒業|獲得|クリア|突破|到達|記録更新)/);
  P.depend = first(s, /(合格|内定|昇進|昇格|当選|優勝|採用|受賞|入賞|入選|選ばれ|1位)/);
  P.luck = P.acts.some(a => a.k === 'ギャンブル断ち') ? '' : first(s, /(宝くじ|ガチャ|抽選|くじ|パチンコ|パチスロ|競馬|競艇|競輪|ギャンブル)/);
  P.danger = first(s, /(断食|絶食|徹夜|一睡も|寝ない|眠らない|水を飲まない|飲まず食わず|何も食べない|食事をしない|嘔吐|下剤)/);
  P.illegal = first(s, /(万引き|無免許|飲酒運転|違法|盗む|盗み|カンニング|不正|詐欺|脱税)/);
  P.caution = first(s, /(食事を抜|ご飯を抜|ごはんを抜|1日1食|一日一食|睡眠を削|寝る時間を削|オールで|3時間睡眠|4時間睡眠)/);
  P.evidence = first(s, /(公開|発表|提出|提案|投稿|出品|リリース|展示|登壇|報告|共有|シェア|記録を残|記録して|記録する)/);

  const acts = P.acts, hit = acts.length > 0;
  const main = acts.slice().sort((x, y) => (y.e + y.c + y.d) - (x.e + x.c + x.d))[0] || null;
  P.main = main;
  P.L = levelRules(s, P);
  if (P.vague && (P.sessionMin || P.km || P.reps || P.pages || P.problems || P.pieces || P.people || P.yen || P.score || P.result || P.L.cSet)) P.vague = '';
  // 期間の提案
  const contTier = days >= 2 ? tierOfDays(days) : null;
  const freqTier = fw >= 7 ? 'daily' : fw >= 1 ? 'weekly' : fw > 0 ? 'monthly' : null;
  let scale = acts.reduce((acc, a) => bigger(acc, a.scale), null);
  scale = bigger(scale, contTier);
  if (fw > 0 && fw < 7) scale = bigger(scale, freqTier);
  if (scale && TIER_RANK[scale] <= 1 && (P.bigCount >= 3 || P.books >= 3 || P.people >= 30 || P.reps >= 300)) scale = upTier(scale);
  scale = bigger(scale, P.countTier || null);
  scale = bigger(scale, P.L.scaleMin || null);
  P.scale = (hit || contTier) ? scale : null;
  P.tier = contTier || dl || P.countTier || freqTier || bigger(main ? main.scale : null, P.L.scaleMin || null) || 'daily';
  // 部門（活動の重みで投票）
  const gv = {career:0, common:0, life:0};
  acts.forEach(a => { gv[a.g] += a.e + a.c + a.d; });
  let genre = 'common';
  if (hit){ const top = Math.max(gv.career, gv.common, gv.life); genre = acts.find(a => gv[a.g] === top).g; }
  P.genre = genre;
  P.domains = Array.from(new Set(acts.filter(a => a.cat !== 'work').map(a => DOMAIN[a.cat])));
  P.tip = main ? main.tip : '';
  // 期間ごとの軸は judge 側で計算（期間で負荷が変わるため）、ここでは提案期間での値を返す
  P.ax = axesFor(P, P.tier, {});
  return P;
}

/* 期間（tier）に応じて、負荷・挑戦・自制の3軸と、量の見積もりを出す */
function axesFor(P, tier, o2){
  if (P.sel) return cgAxes(P, o2);
  const acts = P.acts, hit = acts.length > 0;
  const quant = acts.find(a => !a.stop && !a.ev && a.min > 0) || null;
  let perMin = 0, src = '';
  if (quant){
    if (P.sessionMin){ perMin = P.sessionMin; src = 'time'; }
    else if (P.km && quant.km){ perMin = P.km * quant.km; src = 'km'; }
    else if (P.steps && quant.cat === 'body'){ perMin = P.steps / 110; src = 'steps'; }
    else if (P.pages){ perMin = P.pages * 2; src = 'pages'; }
    else if (P.problems){ perMin = P.problems * 2; src = 'problems'; }
    else if (P.books){ perMin = P.books * 300; src = 'books'; }
    else if (P.reps && quant.cat === 'body'){ perMin = Math.max(5, P.reps * 0.1); src = 'reps'; }
    else if (P.pieces && (quant.cat === 'voice' || quant.cat === 'create')){ perMin = P.pieces * quant.min; src = 'pieces'; }
    else if (P.pieces && quant.k === '語学'){ perMin = Math.max(5, P.pieces * 1.5); src = 'pieces'; }
    else if (P.pieces && quant.k === '日記・振り返り'){ perMin = Math.max(3, P.pieces * 2); src = 'pieces'; }
    else { perMin = quant.min; src = 'default'; }
  }
  const periodDays = P.days >= 2 ? Math.min(P.days, TIER_DAYS[tier]) : TIER_DAYS[tier];
  let sessions = 1;
  if (tier !== 'daily'){
    if (P.freqWeek) sessions = Math.max(1, P.freqWeek * periodDays / 7);
    else if (P.days >= 2) sessions = periodDays;
  }
  sessions *= (P.perDay || 1);
  if (src === 'books' || src === 'pieces') sessions = Math.max(1, sessions === periodDays ? 1 : sessions);
  const total = Math.round(perMin * sessions);
  const TH = {daily:[10,25,55,120], weekly:[30,90,240,600], monthly:[120,400,1000,2500], yearly:[1000,5000,15000,40000]}[tier];
  let eLoad = 0;
  if (quant && perMin){
    eLoad = 1 + TH.filter(x => total >= x).length;
    if (quant.intense && perMin >= 45 && eLoad < 5) eLoad++;
  }
  // 負荷
  let e = 0;
  acts.forEach(a => { const v = a === quant ? (src === 'default' ? Math.round((eLoad + a.e) / 2) : eLoad) : a.e; e = Math.max(e, v); });
  if (!hit) e = 2;
  const L = P.L || {cSet:0, eSet:0, eMin:0, dSet:0, notes:[]};
  if (L.exam && !L.eSet) e = Math.max(2, L.exam);
  if (L.eSet) e = L.eSet;
  e = Math.max(e, L.eMin || 0);
  // 挑戦度
  let c = L.cSet || (hit ? Math.max.apply(null, acts.map(a => a.c)) : 2);
  const cMods = [];
  const stage = (o2 || {}).stage;
  if ((isStu(stage) || stage === 'junior') && acts.some(a => ['boss','improve','stage','plan','grow'].indexOf(a.cat) >= 0 || a.k === '勇気のいる対話')){ c++; cMods.push((isStu(stage) ? '学生' : '社会人1〜3年目') + 'には勇気がいる'); }
  const has = cat => acts.some(a => a.cat === cat);
  if (P.firstW){ c++; cMods.push('「' + P.firstW + '」'); }
  if (P.alone){ c++; cMods.push('「' + P.alone + '」'); }
  if (P.publicW && !has('stage')){ c++; cMods.push('「' + P.publicW + '」'); }
  if (P.compete && !has('exam') && !has('job')){ c++; cMods.push('「' + P.compete + '」'); }
  if (P.money && !has('biz') && !has('sales')){ c++; cMods.push('「' + P.money + '」'); }
  if (P.people >= 30 || P.yen >= 100000){ c++; cMods.push('大きな数字'); }
  c = Math.max(1, Math.min(5, c));
  // 自制心
  let d = hit ? Math.max.apply(null, acts.map(a => a.d)) : 2;
  const dMods = [];
  if (L.dSet){ d = acts.some(a => a.stop || a.k === '早起き' || a.cat === 'money') ? L.dSet : Math.max(d, L.dSet); }
  if (L.exam) d = Math.max(2, L.exam);
  if (P.days >= 180){ d += 3; dMods.push(P.days + '日続ける'); }
  else if (P.days >= 30){ d += 2; dMods.push(P.days + '日続ける'); }
  else if (P.days >= 7){ d += 1; dMods.push(P.days + '日続ける'); }
  else if (tier !== 'daily' && P.freqWeek >= 5){ d += (tier === 'weekly' ? 1 : 2); dMods.push('毎日続ける'); }
  else if (tier !== 'daily' && P.freqWeek >= 3){ d += 1; dMods.push('週' + Math.round(P.freqWeek) + '回続ける'); }
  if (P.early && !acts.some(a => a.k === '早起き')){ d++; dMods.push('早朝'); }
  if (P.hardship){ d++; dMods.push('「' + P.hardship + '」'); }
  d = Math.max(1, Math.min(5, d));
  // 続けやすさ
  const dailyType = tier === 'daily' || P.freqWeek >= 5 || (P.days >= 2 && !P.freqWeek);
  const perDayLoad = perMin * (P.perDay || 1);
  let sus = 'ok';
  if (quant && dailyType && perMin){
    const lim = quant.intense ? [50, 100] : [120, 200];
    if (perDayLoad >= lim[1]) sus = 'over'; else if (perDayLoad >= lim[0]) sus = 'heavy';
  }
  let unreal = '';
  if (dailyType && perDayLoad >= 600) unreal = '1日' + Math.round(perDayLoad / 60) + '時間';
  if (dailyType && quant && quant.km && P.km >= 42 && tier !== 'yearly') unreal = '毎日' + P.km + 'km';
  const bigEv = acts.find(a => a.ev && TIER_RANK[a.scale] >= 2);
  if (P.freqWeek >= 5 && bigEv) unreal = '毎日' + bigEv.k;
  let healthRisk = '';
  if (P.kg){
    const weeks = (P.days >= 7 ? P.days : TIER_DAYS[tier]) / 7;
    if (P.kg / Math.max(1, weeks) > 1) healthRisk = Math.round(P.kg) + 'kgを' + (P.days >= 7 ? P.days + '日' : (tier === 'daily' ? '1日' : tier === 'weekly' ? '1週間' : tier === 'monthly' ? '1ヶ月' : '1年')) + 'で';
  }
  if (unreal) sus = 'over';
  return {e:Math.max(1, Math.min(5, e)), c, d, cMods, dMods, perMin:Math.round(perMin), src, sessions:Math.round(sessions * 10) / 10, total, eLoad, quant, sus, unreal, healthRisk, perDayLoad:Math.round(perDayLoad)};
}

/* 2人の審査 */
function judgeGoal(an, o){
  const s = an.text || '', tier = o.tier;
  const prof = o.prof || {};
  const X = axesFor(an, tier, prof);
  const ax = o.ax || {e:X.e, c:X.c, d:X.d};
  const purpose = String(o.purpose || '').trim();
  const acts = an.acts, hit = acts.length > 0, main = an.main;
  const R = {X, ax, flags:{}, praise:{coach:[], ceo:[]}, advice:{coach:[], ceo:[]}, read:[]};
  R.flags.danger = !!an.danger; R.flags.illegal = !!an.illegal; R.flags.luck = !!an.luck;
  R.flags.caution = !!(an.caution || X.healthRisk);
  R.flags.focus = an.domains.length >= 3;

/* 選べる期間・期限 */

/* 任務名をつくる */

/* 量の倍率：1回の時間（量）が、その活動の標準より多いほど基本点を上げ、少ないほど下げる（0.5〜2.0倍）。

/* 負荷・挑戦・自制の3軸を、選んだ内容から決める */

  if (P.alone){ c++; cMods.push('一人で'); }

  if (P.compete){ c++; cMods.push('大会・審査に出る'); }

  if (E.sub){ const subs = E.sub.s.filter(x => k.indexOf(cgKana(cgNormText(x))) >= 0); if (subs.length) ch.sub = subs.slice(0, CG_SUB_MAX); }
  if (E.t === 'r' && E.q !== 'wk' && E.q !== 'bd'){
    const m = s.match(/(夜|午後|晩)?(\d{1,2})時(?:(\d{1,2})分|(半))?(?:に|から|ごろ|頃)/);
    if (m){ let h = Number(m[2]); if (m[1] && h < 12) h += 12; const mi = m[3] ? Math.min(50, Math.round(Number(m[3]) / 10) * 10) : m[4] ? 30 : 0; if (h < 24) ch.at = h * 60 + mi; }
  }
  if (E.t !== 's'){ const m = String(text || '').normalize('NFKC').match(/(Claude|ChatGPT|Gemini|Copilot|生成AI|AI|アプリ)\s*(?:を)?(?:使い|使って|使う|活用|で)/i); if (m) ch.how = m[1] + 'を使って'; }
  return {E, sel, syn, ch, alts, got, score:top.sc, hits:top.hits};
}
/* 読み取った内容で判定エンジンに渡す形をつくる（任務名は書いた文章のまま） */
function cgBuildFree(text, old, M, prof, tier){
  let E = M.E, sel = Object.assign({}, M.sel);
  if (tier && tierOfDays(sel.p) !== tier){ const s2 = cgAtTier(E, sel, tier); if (!s2) return null; sel = s2; }
  const E2 = M.syn ? Object.assign({}, E, {qo:E.qo.concat([M.syn])}) : E;
  const sel2 = M.syn ? Object.assign({}, sel, {q:E.qo.length}) : sel;
  const P = cgBuild(E2, sel2, M.ch, prof);
  const t = String(text || '').trim();
  P.free = true; P.E = E; P.selReal = sel; P.match = M;
  P.title = t;
  P.text = t + ' ' + P.text;
  if (old.trigger && !(M.ch && M.ch.at != null)) P.trigger = old.trigger;
  if (old.place) P.place = old.place;
  if (old.support) P.support = old.support;
  if (old.ifthen) P.ifthen = old.ifthen;
  if (old.evidence) P.evidence = old.evidence;
  if (old.result && !P.result) P.result = old.result;
  if (old.depend && !P.depend) P.depend = old.depend;
  P.vague = old.vague || '';
  if (old.L && old.L.notes.length && !P.L.notes.length) P.L.notes = old.L.notes.slice(0, 2);
  P.noAmt = !M.got.q && E.qo.length > 0 && E.t === 'r';
  P.noTime = !M.got.p && !M.got.f && !(E.t === 'r' && sel.p === 1) && !(E.t === 's' && sel.p === 1) && !tier;
  const dflt = '（書かれていないので標準）';
  P.readSel = P.readSel.map(r => {
    const k = r[0];
    if (k === '活動') return ['リストの活動', r[1]];
    if (k === '1回の量' && !M.got.q) return [k, r[1] + dflt];
    if ((k === '期間' || k === 'いつまでに') && !M.got.p && !tier && !(sel.p === 1 && (E.t === 's' || (E.t === 'r' && sel.f !== 'o')))) return [k, r[1] + dflt];
    if (k === '頻度' && !M.got.f) return [k, r[1] + dflt];
    if (k === 'レベル' && !M.got.lv) return [k, r[1] + dflt];
    if (k === '目標の数' && !M.got.q) return [k, r[1] + dflt];
    return r;
  });
  P.ax = cgAxes(P, prof || {});
  return P;
}

function levelOf(total){

  const L = Math.floor(Math.sqrt(total / 40)) + 1;

  return {L, pct: (total - base) / (next - base), toNext: next - total};
}

/* 期間 */
function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function weekStart(d){ const t = new Date(d.getFullYear(), d.getMonth(), d.getDate()); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t; }
function isoWeek(d){
  const mon = weekStart(d); const thu = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 3);
  const y = thu.getFullYear();
  const w = 1 + Math.floor(Math.round((thu - new Date(y, 0, 1)) / 864e5) / 7);
  return {y, w};
}
function periodKey(tier, d){
  d = d || new Date();
  if (tier === 'daily') return dayKey(d);
  if (tier === 'weekly'){ const iw = isoWeek(d); return iw.y + '-W' + pad(iw.w); }
  if (tier === 'monthly') return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  return String(d.getFullYear());
}
function periodEnd(tier, d){
  d = d || new Date();
  if (tier === 'daily') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  if (tier === 'weekly'){ const m = weekStart(d); return new Date(m.getFullYear(), m.getMonth(), m.getDate() + 7); }
  if (tier === 'monthly') return new Date(d.getFullYear(), d.getMonth() + 1, 1);
  return new Date(d.getFullYear() + 1, 0, 1);
}
function periodLabel(tier, d){
  d = d || new Date();
  const md = x => (x.getMonth() + 1) + '/' + x.getDate();
  if (tier === 'daily') return '今日 ' + md(d);
  if (tier === 'weekly'){ const m = weekStart(d); const s = new Date(m.getFullYear(), m.getMonth(), m.getDate() + 6); return '今週 ' + md(m) + '〜' + md(s); }
  if (tier === 'monthly') return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
  if (tier === 'yearly') return d.getFullYear() + '年';
  return 'これまでの累計';
}
function countdown(tier){
  if (!TIER[tier]) return '';
  const m = Math.max(0, Math.floor((periodEnd(tier) - Date.now()) / 60000));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d >= 2) return 'リセットまで' + d + '日';
  if (d >= 1) return 'リセットまで' + d + '日' + h + '時間';
  if (h >= 1) return 'リセットまで' + h + '時間' + mm + '分';
  return 'リセットまで' + mm + '分';
}
function fmtDate(ms){ const d = new Date(Number(ms) || 0); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); }
function asOf(){ const d = new Date(); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日現在'; }

/* 任務の生成 */
function lifeIds(tier, life, time, legacy){
  const n = tier === 'daily' ? (time === '15' || time === '10' ? 1 : time === '120' ? 3 : 2) : 1;
  const L = {daily:'ld-', weekly:'lw-', monthly:'lm-', yearly:'ly-'}[tier];
  // どの期間も同じ自分磨き（Annualと同じテーマ）を1つ目にして、Annual→Dailyがつながるようにする
  const prim = legacy ? null : LIFE_PREF.yearly.find(c => life.indexOf(c) >= 0);
  const order = prim ? [prim].concat(LIFE_PREF[tier].filter(c => c !== prim)) : LIFE_PREF[tier];
  return order.filter(c => life.indexOf(c) >= 0).slice(0, n).map(c => L + c).filter(id => POOL_BY_ID[id]);
}
/* 質問のあとに届く任務：1年後の目標から逆算した、Daily・Weekly・Monthly・Annual 1つずつのつながり */
function generateQuests(ans){
  const out = {};
  TIERS.forEach(tier => {
    const q = POOL.find(p => p.tier === tier && p.tag === 'g:' + ans.goal) || POOL.find(p => p.tier === tier && p.tag === 'f:' + ans.field);
    out[tier] = q ? [q.id] : [];
  });
  return out;
}
/* 以前の配り方（任務の保存がない古いデータの表示用） */
function generateQuestsFull(ans){
  const t = TIME[ans.time] ? ans.time : '30';
  const life = Array.isArray(ans.life) ? ans.life : LIFE_ALL;
  const out = {};
  TIERS.forEach(tier => {
    const ids = [];
    // キャリア：目指すフィールド(f)と1年後の目標(g)から
    CAREER_SLOTS[tier].slice(0, CAREER_N[t][tier]).forEach(slot => {
      const q = POOL.find(p => p.tier === tier && p.tag === (slot === 'f' ? 'f:' + ans.field : 'g:' + ans.goal));
      if (q && ids.indexOf(q.id) < 0) ids.push(q.id);
    });
    // 共通：伸ばしたい力(s)から。Dailyの2つ目は誰にでも役立つ任務
    const nCommon = COMMON_N[t][tier];
    if (nCommon > 0){
      const q = POOL.find(p => p.tier === tier && p.tag === 's:' + ans.skill);
      if (q) ids.push(q.id);
      if (tier === 'daily' && nCommon > 1){
        const pick = (ans.skill === 'habit' ? ['d-x2','d-x1'] : ['d-x1','d-x2']).find(id => ids.indexOf(id) < 0);
        if (pick) ids.push(pick);
      }
    }
    // 自分磨き：選んだジャンルから
    lifeIds(tier, life, t).forEach(id => ids.push(id));
    out[tier] = ids;
  });
  return out;
}
function questsOf(me){
  const a = (me && me.answers) || {};
  const qs = (me && me.quests) || (me && me.answers ? generateQuestsFull(a) : null);
  const legacy = !Array.isArray(a.life);
  const rm = removedOf(me);
  const out = {};
  TIERS.forEach(t => {
    const ids = ((qs && qs[t]) || []).slice();
    if (legacy) lifeIds(t, LIFE_ALL, a.time, true).forEach(id => { if (ids.indexOf(id) < 0) ids.push(id); });
    const list = ids.filter(id => rm.indexOf(id) < 0).map(id => POOL_BY_ID[id]).filter(Boolean).sort((x, y) => GENRE_ORDER[x.genre] - GENRE_ORDER[y.genre]);
    const cust = (Array.isArray(me && me.custom) ? me.custom : []).filter(c => c && c.tier === t).map(normCustom).filter(Boolean);
    out[t] = list.concat(cust);
  });
  return out;
}
function removedOf(me){ return Array.isArray(me && me.removed) ? me.removed.filter(id => typeof id === 'string' && POOL_BY_ID[id]) : []; }
function questById(id){
  if (POOL_BY_ID[id]) return POOL_BY_ID[id];
  const c = (Array.isArray(S.me && S.me.custom) ? S.me.custom : []).find(x => x && x.id === id);
  return c ? normCustom(c) : null;
}
function logGenre(l){ return POOL_BY_ID[l.questId] ? POOL_BY_ID[l.questId].genre : (GENRE[l.genre] ? l.genre : 'career'); }
function computeStats(logs){
  const stats = {}, tierTotal = {}, genreTotal = {career:0, common:0, life:0}; let total = 0;
  TIERS.forEach(t => { stats[t] = {k: periodKey(t), v: 0}; tierTotal[t] = 0; });
  logs.forEach(l => {
    const p = Number(l.pts) || 0; total += p; genreTotal[logGenre(l)] += p;
    if (tierTotal[l.tier] != null){ tierTotal[l.tier] += p; if (l.period === stats[l.tier].k) stats[l.tier].v += p; }
  });
  return {stats, tierTotal, genreTotal, total, count: logs.length};
}
function tierPts(p, tier){
  if (!p) return 0;
  if (tier === 'total') return Number(p.total) || 0;
  const st = p.stats && p.stats[tier];
  if (!st) return 0;
  if (p.sample) return Number(st.v) || 0;
  return st.k === periodKey(tier) ? (Number(st.v) || 0) : 0;
}
function isDone(q){ const k = periodKey(q.tier); return S.logs.some(l => l.period === k && (l.questId === q.id || (q.custom && l.custom && l.title === q.t && l.tier === q.tier))); }

/* ---------- 起動 ---------- */
function useCap(name){
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      return Promise.race([
        Promise.resolve(window.claude.use(name)),
        new Promise(r => setTimeout(() => r(null), 11000))
      ]).catch(() => null);
    }
  } catch(e){}
  return Promise.resolve(null);
}
function start(hot){
  if (hot && typeof hot === 'object'){
    if (hot.tab) S.hot = true; // 編集中の再読み込み（前の画面を引き継ぐとき）は、使い方を出さない
    if (['quests','rank','log','me'].indexOf(hot.tab) >= 0) S.tab = hot.tab;
    if (['daily','weekly','monthly','yearly','total'].indexOf(hot.rankTier) >= 0) S.rankTier = hot.rankTier;
    if (hot.rankScope === 'age') S.rankScope = 'age';
  }
  try { const v = localStorage.getItem('careerquest.samples'); if (v === '0') S.showSamples = false; } catch(e){}
  S.lastDay = dayKey();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({tab:S.tab, rankTier:S.rankTier, rankScope:S.rankScope})); } catch(e){}
  render();
  init();
  setInterval(tick, 30000);
}
async function init(){
  const has = !!(window.claude && typeof window.claude.use === 'function');
  if (!has) return startLocal();
  const res = await Promise.all([useCap('db'), useCap('user')]);
  const db = res[0], user = res[1];
  let uid = null;
  if (user){ try { uid = await user.id(); } catch(e){} }
  if (S.mode === 'local') return;
  if (!db || !uid) return startLocal();
  S.db = db; S.user = user; S.uid = uid; S.mode = 'online';
  try { let o = user.isOwner(); if (o && o.then) o = await o; S.isOwner = !!o; } catch(e){}
  try { let w = user.can('data.write'); if (w && w.then) w = await w; if (w === false) S.readOnly = true; } catch(e){}
  watchSafety(db, uid, S.isOwner);
  watchRequests(db, uid, S.isOwner);
  S.loadTimer = setTimeout(() => {
    if (!S.meLoaded){
      $('#splash-msg').textContent = 'データにまだ接続できません。電波の良い場所で待つか、この端末だけで始められます。';
      $('#go-local').hidden = false;
    }
  }, 10000);
  const meRef = db.doc('players/' + uid);
  S.unsubs.push(meRef.onSnapshot(snap => {
    S.me = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache || snap.exists){ S.meLoaded = true; clearTimeout(S.loadTimer); }
    if (S.meLoaded) onData();
  }, err => { S.meLoaded = true; clearTimeout(S.loadTimer); onData(); }));
  S.unsubs.push(meRef.collection('log').orderBy('at', 'desc').limit(500).onSnapshot(snap => {
    S.logs = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    if (S.meLoaded) render();
  }, () => {}));
  S.unsubs.push(db.collection('players').limit(1000).onSnapshot(snap => {
    S.players = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    if (S.meLoaded) render();
  }, () => {}));
}
function startLocal(){
  S.unsubs.forEach(u => { try { u(); } catch(e){} }); S.unsubs = [];
  clearTimeout(S.loadTimer);
  S.mode = 'local'; S.uid = 'local'; S.db = null;
  loadLocal(); loadSafetyLocal(); loadReqLocal(); refreshLocalPlayers(); S.meLoaded = true;
  onData();
}
function onData(){
  $('#splash').hidden = true;
  if (!S.me && !S.ob && !S.readOnly) openOnboarding(false);
  render();
  // 起動したら、目標の立て方を説明する（1回の起動につき1回）
  if (!S.guideChecked && S.me && !S.ob){
    S.guideChecked = true;
    // 規約にまだ同意していない人は、先に18歳以上の確認と同意をもらう

  }
}
function tick(){
  document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = countdown(el.getAttribute('data-cd')); });

/* ---------- つながり：Annual→Monthly→Weekly→Daily ---------- */
const CHAIN_COLORS = ['#2f45d8', '#13895a', '#c27606', '#7a43c4', '#0a7cbd', '#b9520f', '#c03a7a', '#0b8079'];
function chainTagLabel(tag){
  const [k, v] = String(tag).split(':');
  return k === 'g' ? '1年後の目標：' + (GOAL[v] || '') : k === 'f' ? '興味のある分野：' + (FIELD[v] || '') : k === 's' ? '伸ばす力：' + (SKILL[v] || '') : k === 'l' ? '自分磨き：' + (LIFE[v] || '') : '';
}
/* 今の任務を、つながりごとにまとめる（マイ任務は同じつながりID、おすすめ任務は同じテーマ） */
function chainsOf(me){
  const qs = questsOf(me), list = [], by = {}, map = {}, loose = [];
  T4.forEach(t => (qs[t] || []).forEach(q => {
    let id = '', label = '', kind = '', tag = '';
    if (q.custom){ if (q.lk){ id = 'c:' + q.lk; label = q.lkn || q.t; kind = 'mine'; } }
    else { const P0 = POOL_BY_ID[q.id]; if (P0 && P0.tag && P0.tag !== 'x'){ tag = P0.tag; id = 'p:' + tag; label = chainTagLabel(tag); kind = 'pool'; } }
    if (!id){ loose.push(q); return; }
    let c = by[id];
    if (!c){ c = by[id] = {id, label, kind, tag, q:{}, more:{}}; list.push(c); }
    if (c.q[t]) (c.more[t] = c.more[t] || []).push(q); else c.q[t] = q;
  }));
  list.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'mine' ? -1 : 1));
  list.forEach((c, i) => {
    c.idx = i; c.color = CHAIN_COLORS[i % CHAIN_COLORS.length];
    c.n = T4.filter(t => c.q[t]).length;
    T4.forEach(t => [c.q[t]].concat(c.more[t] || []).forEach(q => { if (q) map[q.id] = c; }));
  });
  return {list, map, loose};
}
function chainChip(c){
  if (!c) return '';

function chainNode(c, t, q, me){

    '<div class="n-meta"><span class="n-pts">+' + fmt(q.pts) + '<small>pt</small></span>' + (q.custom ? '<span class="n-kind">マイ任務</span>' : '') +

    '<div class="chain-h"><span class="cdot" aria-hidden="true"></span><div><b>' + esc(c.label) + '</b><small>' + (c.kind === 'mine' ? 'マイ任務のつながり' : 'おすすめ任務のつながり') + '・' + c.n + '/4段・これまでに' + fmt(chainEarned(c)) + 'pt獲得</small></div>' +

}

function chainSuggest(me, CH){
  const a = (me && me.answers) || {};

  const tags = ['g:' + a.goal, 's:' + a.skill, 'f:' + a.field].concat((Array.isArray(a.life) ? a.life : []).map(k => 'l:' + k));
  return Array.from(new Set(tags)).filter(t => !have.has(t) && T4.every(x => POOL.some(p => p.tier === x && p.tag === t)));
}
async function chainAdd(tag){
  const me = S.me; if (!me || S.readOnly) return;
  const ids = T4.map(t => POOL.find(p => p.tier === t && p.tag === tag)).filter(Boolean);
  const qs = JSON.parse(JSON.stringify(me.quests || generateQuestsFull(me.answers || {})));
  ids.forEach(q => { qs[q.tier] = Array.isArray(qs[q.tier]) ? qs[q.tier] : []; if (qs[q.tier].indexOf(q.id) < 0) qs[q.tier].push(q.id); });
  const rm = removedOf(me).filter(id => !ids.some(q => q.id === id));
  try { await saveMe(Object.assign({}, me, {quests:qs, removed:rm, updatedAt:Date.now()})); chainGo('p:' + tag); toast('つながり「' + chainTagLabel(tag) + '」を追加しました'); }
  catch(e){ toast(errMsg(e)); }
}

/* プランの1段から、保存するマイ任務をつくる */
function cgSelPlain(s, E){ const o = {q:s.q, f:s.f, p:s.p, st:s.st, lim:s.lim, win:s.win, sc:s.sc, lv:s.lv}; const op = E && E.qo[s.q]; if (op){ o.ql = op.l; if (E.qw && E.qw.dur) o.qm = op.m; } return o; }
function cgRungItem(r, lk, lkn){
  const R = r.R;
  return {id:'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t:r.title.slice(0, 60), tier:r.tier, genre:r.E.g, ax:{e:R.ax.e, c:R.ax.c, d:R.ax.d}, pts:R.pts, like:R.like,
    judge:{coach:R.coach.score, ceo:R.ceo.score, total:R.total}, tip:r.E.tip, purpose:String(r.purpose || '').slice(0, 40), at:Date.now(), act:r.E.n, src:{n:r.E.n, s:cgSelPlain(r.sel, r.E)}, lk, lkn:String(lkn || '').slice(0, 24)};
}
function cgCleanSel(E, s){
  if (!E || !s || typeof s !== 'object') return null;
  const int = (v, n) => { v = Math.round(Number(v)); return v >= 0 && v < n ? v : 0; };
  const sel = {q:int(s.q, Math.max(1, E.qo.length)), f:CG_FREQ[s.f] ? s.f : (E.fd || '7'), p:CG_DAYS.indexOf(Number(s.p)) >= 0 ? Number(s.p) : Number(s.p) > 0 ? cgNearDays(Number(s.p), CG_DAYS) : 30,
    st:['zero', 'lim', 'win'].indexOf(s.st) >= 0 ? s.st : 'zero', lim:int(s.lim, (E.lim || []).length || 1), win:int(s.win, (E.win || []).length || 1),
    sc:CG_SCOPE[s.sc] ? String(s.sc) : '7', lv:int(s.lv, (E.lv || []).length || 1)};
  // 時間のダイヤル：保存した分（qm）から選び直す。qmがない古い記録は、前の選択肢の番号から分を読む
  // 量：保存したラベル（ql）→ 時間（qm）→ 古い記録は前の選択肢の番号から読み替える
  if (E.qo.length){
    const byL = typeof s.ql === 'string' ? E.qo.findIndex(o => o.l === s.ql) : -1;
    if (byL >= 0) sel.q = byL;
    else if (E.qw && E.qw.dur && Number(s.qm) > 0) sel.q = cgNearQ(E, Number(s.qm));
    else if (E.qo0){ const i = cgFindOpt(E, E.qo0[Math.round(Number(s.q))]); sel.q = i >= 0 ? i : cgDefaults(E).q; }
  }
  return cgFix(E, sel);
}
/* つながりの空いた段に、おすすめを足す */
async function chainFill(cid, t){
  const me = S.me; if (!me || S.readOnly) return;
  const c = chainsOf(me).list.find(x => x.id === cid); if (!c || c.q[t]) return;
  const prof = me.answers || {};
  if (c.kind === 'pool'){
    const q = POOL.find(p => p.tier === t && p.tag === c.tag);
    if (!q){ toast('この期間に合う任務がありません'); return; }
    const ok = await confirmDlg('「' + fillText(q.t, me.answers) + '」（' + TIER[t].ja + '・+' + fmt(q.pts) + 'pt）を、このつながりに追加しますか？', '追加する');
    if (!ok) return;
    const qs = JSON.parse(JSON.stringify(me.quests || generateQuestsFull(me.answers || {})));
    qs[t] = Array.isArray(qs[t]) ? qs[t] : [];
    if (qs[t].indexOf(q.id) < 0) qs[t].push(q.id);
    try { await saveMe(Object.assign({}, me, {quests:qs, removed:removedOf(me).filter(x => x !== q.id), updatedAt:Date.now()})); render(true); toast(TIER[t].ja + 'に追加しました'); } catch(e){ toast(errMsg(e)); }
    return;
  }
  if (customCount(t) >= MAX_CUSTOM){ toast(TIER[t].ja + 'のマイ任務はすでに' + MAX_CUSTOM + 'つあります'); return; }
  const anchor = T4.map(x => c.q[x]).filter(q => q && q.src)[0];
  if (!anchor){ toast('この期間に合う任務が見つかりませんでした'); return; }
  const E = CAT_BY_N[anchor.src.n];
  const avoid = T4.map(x => c.q[x]).filter(q => q && q.src && q !== anchor).map(q => q.src.n);
  const plan = cgPlanJudge(cgPlan(E, anchor.src.s, prof, avoid), prof, anchor.t, anchor.purpose);
  const r = plan.rungs[t];
  if (!r || r.me || !r.R || r.R.blocked){ toast('この期間に合う任務が見つかりませんでした'); return; }
  const ok = await confirmDlg('「' + r.title + '」（' + TIER[t].ja + '・+' + fmt(r.R.pts) + 'pt）を、このつながりに追加しますか？', '追加する');
  if (!ok) return;
  const lk = cid.slice(2);
  try { await saveMe(Object.assign({}, me, {custom:(Array.isArray(me.custom) ? me.custom.slice() : []).concat([cgRungItem(r, lk, c.label)]), updatedAt:Date.now()})); render(true); toast(TIER[t].ja + 'に追加しました'); }
  catch(e){ toast(errMsg(e)); }
}

/* ダイヤル（上下にスクロールして選ぶ）。k='q'（量・時間・数）／'lim'（やめる量）／'win'（やめる時間帯）
