/* 量が多すぎる時の注意書き（続けられるのが1番） */
function cgWarnHtml(P, X){
  if (!P || !P.sel || !P.E || !P.z || !X) return '';
  const E = P.E, Z = P.z, opt = Z.opt; if (!opt) return '';
  let lv = 0, why = '', few = false;
  if (X.healthRisk) return '';
  if (X.unreal){ lv = 2; why = '1日の量として現実的ではありません'; }
  else if (X.sus === 'over'){ lv = 2; why = '体や生活に無理が出やすい量です'; }
  else if (X.sus === 'heavy'){ lv = 1; why = 'かなり多めの量です'; }
  if (!lv && E.q === 'wk' && opt.s < 270){ lv = 1; few = true; why = 'とても早い起床です'; }
  if (!lv && E.q === 'bd' && opt.s >= 780){ lv = 1; few = true; why = '遅めの時刻です。睡眠が短くなりがちです'; }
  if (!lv && E.q === 'sl' && (opt.s < 360 || opt.s > 600)){ lv = 1; few = opt.s < 360; why = opt.s < 360 ? '睡眠が短めです' : '睡眠が長めです'; }
  if (!lv && E.q === 'wa' && parseFloat(opt.l) >= 3.5){ lv = 1; why = '水の飲みすぎにも注意が必要な量です'; }
  const ratio = E.t === 'r' && E.qref > 0 && opt.m > 0 ? opt.m / E.qref : E.t === 'n' && E.qdv > 0 && opt.v > 0 ? opt.v / E.qdv : 0;
  if (!lv && ratio >= 4){ lv = 1; why = '標準（' + E.qdl + '）の約' + Math.round(ratio) + '倍です'; }
  else if (lv && ratio >= 2 && E.qdl) why += '（標準は' + E.qdl + '）';
  if (!lv) return '';
  return '<p class="wwarn lv' + lv + '" role="status"><b>' + (lv === 2 ? '⚠ 多すぎるかもしれません' : 'ちょっと注意') + '</b>　' + esc(why) + '。' +
    (few ? '体に無理があると、続かなくなりがちです。<b>続けられるのが1番だからね！</b>無理のないところから始めよう。' : '最初から多すぎると、続かなくなりがちです。<b>続けられるのが1番だからね！</b>まずは少なめから始めて、慣れたら増やしていこう。') + '</p>';
}
function cgWheelSpec(E, k){

  return {k, list:true, cols:[{v:labels.map((x, i) => i), l:labels, u:''}], opts:labels.map((l, i) => ({l, w:[i], s:i})), sc:a => a[0]};
}
function cgWheelLabel(E, k){

function cgWheelHtml(E, sel, k, id, after){

      '<div class="wpad"></div>' + c.v.map((v, i) => '<div class="wi" data-i="' + i + '">' + esc(txt(i)) + '</div>').join('') + '<div class="wpad"></div></div>' +

}
function cgWheelIdx(col){ const n = col.querySelectorAll('.wi').length; return Math.max(0, Math.min(n - 1, Math.round(col.scrollTop / CG_WH_H))); }
function cgWheelVals(W, spec){ return Array.from(W.querySelectorAll('.wcol')).map((c, ci) => spec.cols[ci].v[cgWheelIdx(c)]); }
function cgWheelFind(spec, vals){ return spec.opts.findIndex(o => o.w.every((x, i) => x === vals[i])); }
function cgWheelTo(W, spec, oi, smooth){
  const o = spec.opts[oi]; if (!o) return;
  W.querySelectorAll('.wcol').forEach((col, ci) => {
    const t = Math.max(0, spec.cols[ci].v.indexOf(o.w[ci])) * CG_WH_H;
    if (Math.abs(col.scrollTop - t) < 1) return;
    if (smooth && col.scrollTo) col.scrollTo({top:t, behavior:'smooth'}); else col.scrollTop = t;
  });
}
function cgWheelPaint(col){
  const c = col.scrollTop / CG_WH_H;
  col.querySelectorAll('.wi').forEach((it, i) => {
    const d = Math.max(-3, Math.min(3, i - c)), a = Math.abs(d);
    it.style.transform = 'perspective(320px) rotateX(' + (-d * 24).toFixed(1) + 'deg) scale(' + (1 - a * 0.07).toFixed(3) + ')';
    it.style.opacity = String(Math.max(0.18, 1 - a * 0.3).toFixed(2));
    it.classList.toggle('on', Math.abs(i - c) < 0.5);
  });
}
function cgWheelAria(W, spec){
  W.querySelectorAll('.wcol').forEach((col, ci) => { const c = spec.cols[ci], i = cgWheelIdx(col); col.setAttribute('aria-valuenow', i); col.setAttribute('aria-valuetext', (c.l ? c.l[i] : String(c.v[i])) + c.u); });
}
/* 止まったところで決める。選べない組み合わせ（0分、1時間5分など）は、いちばん近いものに寄せる */
function cgWheelSum(W){ const r = W.closest('.wrow'); return r ? r.querySelector('.wsum b') : null; }
function cgWheelCommit(W, ctx, spec){
  if (!W.isConnected || !ctx.ok()) return;
  const vals = cgWheelVals(W, spec);
  let i = cgWheelFind(spec, vals);
  if (i < 0){
    const want = spec.sc(vals); let bd = Infinity;
    spec.opts.forEach((o, k) => { const d = Math.abs(o.s - want) - (o.s > want ? 1e-3 : 0); if (d < bd){ bd = d; i = k; } });
    cgWheelTo(W, spec, i, true);
  }
  cgWheelAria(W, spec);
  const sum = cgWheelSum(W); if (sum) sum.textContent = spec.opts[i].l;
  if (i !== ctx.sel[spec.k]){ ctx.sel[spec.k] = i; ctx.on(); }
}
/* ダイヤルを動くようにする。ctxOf(W) は {E, sel, ok(), on()}（省略時は「どれくらいやる？」のダイヤル） */
function cgWheelInit(root, ctxOf){
  const G = S.cg; if (!root || !G) return;
  root.querySelectorAll('.wheel').forEach(W => {
    let ctx = ctxOf ? ctxOf(W) : null;
    if (!ctx){ const E = G.E; if (!E) return; ctx = {E, sel:G.sel, ok:() => S.cg === G && G.E === E, on:() => { G.manual = G.manual.genre ? {genre:true} : {}; cgPickUpdate(); }}; }
    const E = ctx.E, spec = cgWheelSpec(E, W.dataset.k), cur = ctx.sel[spec.k];
    let timer = 0;
    W.querySelectorAll('.wcol').forEach(col => {
      let raf = 0;
      col.addEventListener('scroll', () => {
        if (!raf) raf = requestAnimationFrame(() => {
          raf = 0; if (!W.isConnected) return;
          cgWheelPaint(col);
          const i = cgWheelFind(spec, cgWheelVals(W, spec)), sum = cgWheelSum(W); if (sum && i >= 0) sum.textContent = spec.opts[i].l;
        });
        clearTimeout(timer); timer = setTimeout(() => cgWheelCommit(W, ctx, spec), 140);
      }, {passive:true});
      col.addEventListener('keydown', ev => {
        const n = col.querySelectorAll('.wi').length, k = cgWheelIdx(col);
        const to = {ArrowUp:k + 1, ArrowDown:k - 1, PageUp:k + 5, PageDown:k - 5, Home:0, End:n - 1}[ev.key];
        if (to == null) return;
        ev.preventDefault();
        col.scrollTop = Math.max(0, Math.min(n - 1, to)) * CG_WH_H;
      });
      col.addEventListener('click', ev => { const it = ev.target.closest('.wi'); if (it) col.scrollTo({top:Number(it.dataset.i) * CG_WH_H, behavior:'smooth'}); });
    });
    const sync = () => { if (!W.isConnected) return; cgWheelTo(W, spec, cur, false); W.querySelectorAll('.wcol').forEach(cgWheelPaint); };
    sync(); requestAnimationFrame(sync);
  });
}

function removePatch(me, ids){

  custom.forEach(c => { if (c && set.has(c.id)) undo.push({kind:'custom', item:c}); });
  const qs = JSON.parse(JSON.stringify(me.quests || generateQuestsFull(me.answers || {})));
  const rm = removedOf(me);
  ids.forEach(id => {
    const P0 = POOL_BY_ID[id]; if (!P0) return;
    TIERS.forEach(t => { if (Array.isArray(qs[t])) qs[t] = qs[t].filter(x => x !== id); });
    if (rm.indexOf(id) < 0) rm.push(id);
    undo.push({kind:'pool', id, tier:P0.tier});
  });
  return {patch:{custom:custom.filter(c => !(c && set.has(c.id))), quests:qs, removed:rm}, undo};
}

/* 書いた文章をチェック：問題なければ ''、あれば理由 */
function ngCheck(text){
  const t = String(text || '').normalize('NFKC');
  if (!t.trim()) return '';
  const flat = t.toLowerCase().replace(/[\s　・._*＊~〜]/g, '');
  if (/(https?:\/\/|www\.|[a-z0-9-]+\.(com|net|org|jp|io|me|co|info|xyz|link|app)\b)/i.test(t)) return 'contact';
  if (/[\w.+-]+@[\w-]+\.[\w.-]+/.test(t)) return 'contact';
  const digits = (t.match(/(?:\+?81|0)[\d\s()（）-]{8,16}\d/g) || []).map(s => s.replace(/\D/g, ''));
  if (digits.some(d => d.length >= 10 && d.length <= 13)) return 'contact';
  if (/(line|ライン|インスタ|insta|twitter|ツイッター|tiktok|discord|ディスコード)\s*(id|ＩＤ|アカ|垢|追加|交換|@)/i.test(t)) return 'contact';
  const low = t.toLowerCase();
  if (NG_NORM.some(w => low.indexOf(w) >= 0 || flat.indexOf(w.replace(/[\s　・._*＊~〜]/g, '')) >= 0)) return 'word';
  return '';
}

  S.safety = {blocked:next.blocked.slice(0, 500), hidden:next.hidden.slice(-1000), updatedAt:Date.now()};
  if (S.mode === 'online') return enqueue(() => S.db.collection('data/users/' + S.uid).doc('safety').set(S.safety));
  try { localStorage.setItem(SAFETY_LS, JSON.stringify(S.safety)); } catch(e){}
}
function watchSafety(db, uid, owner){
  try { S.unsubs.push(db.collection('data/users/' + uid).doc('safety').onSnapshot(snap => { S.safety = snap.exists ? snap.data() : null; if (S.meLoaded) render(); }, () => {})); } catch(e){}
  try { S.unsubs.push(db.doc('mod/state').onSnapshot(snap => { S.mod = snap.exists ? snap.data() : null; if (S.meLoaded) render(); }, () => {})); } catch(e){}

/* ---- 通報 ---- */
const REPORT_REASONS = [['abuse', '悪口・嫌がらせ・差別'], ['sexual', '性的・暴力的な内容'], ['privacy', '個人情報・連絡先が書かれている'], ['spam', '宣伝・スパム・なりすまし'], ['other', 'そのほか']];
function reportDlg(label){
  return new Promise(res => {
    const el = $('#dlg');
    el.innerHTML = '<div class="dlg-card rep-card" role="dialog" aria-modal="true" aria-labelledby="rp-h"><h3 id="rp-h" style="margin:0;font-size:16px">通報する</h3>' +
      '<p class="small" style="line-height:1.6">' + esc(label) + '</p>' +
      '<div class="rp-reasons" role="radiogroup" aria-label="通報の理由">' + REPORT_REASONS.map(r => '<label class="rp-r"><input type="radio" name="rp-r" value="' + r[0] + '"><span>' + r[1] + '</span></label>').join('') + '</div>' +
      '<textarea class="txt" id="rp-detail" rows="2" maxlength="300" placeholder="くわしい内容（任意）"></textarea>' +
      '<p class="note">通報した人の名前は、相手には伝わりません。運営者が確認し、規約に反する内容は非表示にします。</p>' +
      '<div class="dlg-btns"><button type="button" class="btn-ghost" id="rp-no">やめる</button><button type="button" class="btn-primary" id="rp-ok" disabled>通報する</button></div></div>';
    el.hidden = false;
    const done = v => { el.hidden = true; el.innerHTML = ''; res(v); };
    el.querySelectorAll('input[name="rp-r"]').forEach(i => { i.onchange = () => { $('#rp-ok').disabled = false; }; });
    $('#rp-no').onclick = () => done(null);
    $('#rp-ok').onclick = () => { const r = el.querySelector('input[name="rp-r"]:checked'); if (!r) return; done({reason:r.value, detail:($('#rp-detail').value || '').trim().slice(0, 300)}); };
    setTimeout(() => { try { el.querySelector('input[name="rp-r"]').focus(); } catch(e){} }, 30);
  });
}
async function submitFlag(target){
  if (!S.me || S.readOnly){ toast('通報するには、参加の手続きが必要です'); return; }
  const p = S.players.find(x => x.id === target.uid) || {};
  const label = target.logId ? '「' + nameOf(p) + '」さんの記録「' + String(target.title || '').slice(0, 40) + '」を通報します。理由を選んでください。' : '「' + nameOf(p) + '」さん（ニックネームや実績書）を通報します。理由を選んでください。';
  const r = await reportDlg(label); if (!r) return;
  const item = {id:'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), uid:target.uid, name:nameOf(p).slice(0, 16), logId:target.logId || '', title:String(target.title || '').slice(0, 80), text:String(target.text || '').slice(0, 300), reason:r.reason, detail:r.detail, at:Date.now()};
  try {
    if (S.mode === 'online'){
      const ref = S.db.collection('reports').doc(S.uid);
      let items = [];
      try { const snap = await ref.get(); if (snap.exists && Array.isArray(snap.data().items)) items = snap.data().items; } catch(e){}
      await enqueue(() => ref.set({items:items.concat([item]).slice(-200), name:nameOf(S.me), updatedAt:Date.now()}));
    } else {
      const k = 'careerquest.flags.v1'; let a = []; try { a = JSON.parse(localStorage.getItem(k) || '[]'); } catch(e){}
      a.push(item); try { localStorage.setItem(k, JSON.stringify(a.slice(-200))); } catch(e){}
    }
    if (target.logId){ const s = safetyOf(); s.hidden.push(target.uid + '/' + target.logId); await saveSafety(s); }
    toast('通報しました。運営者が確認します' + (target.logId ? '。この記録はあなたには表示されません' : ''), target.logId ? '' : 'ブロックも', () => blockUser(target.uid));
    if (target.logId && !$('#psheet').hidden) openPlayer(target.uid);
  } catch(e){ toast(errMsg(e)); }
}
/* ---- ブロック ---- */
async function blockUser(uid){
  if (!uid || uid === S.uid) return;
  const p = S.players.find(x => x.id === uid) || {};
  const ok = await confirmDlg('「' + nameOf(p) + '」さんをブロックしますか？ランキングや実績書に、この人が表示されなくなります。相手には通知されません。マイページからいつでも解除できます。', 'ブロックする');
  if (!ok) return;
  const s = safetyOf(); if (s.blocked.indexOf(uid) < 0) s.blocked.push(uid);
  try { await saveSafety(s); closePsheet(); render(); toast('ブロックしました'); } catch(e){ toast(errMsg(e)); }
}
async function unblockUser(uid){
  const s = safetyOf(); s.blocked = s.blocked.filter(x => x !== uid);
  try { await saveSafety(s); render(true); toast('ブロックを解除しました'); } catch(e){ toast(errMsg(e)); }
}

/* ---- オーナーの対応（通報の確認・非表示） ---- */

  const out = [];
  (S.reports || []).forEach(r => (Array.isArray(r.items) ? r.items : []).forEach(it => { if (it && it.id) out.push(Object.assign({reporter:r.reporter, reporterName:r.name || ''}, it)); }));
  return out.sort((a, b) => (b.at || 0) - (a.at || 0));
}
async function modUpdate(fn, msg){

  const m = modOf(); const next = {hiddenLogs:Object.assign({}, m.hiddenLogs), hiddenUsers:m.hiddenUsers.slice(), resolved:m.resolved.slice()};

  try { S.mod = next; await enqueue(() => S.db.doc('mod/state').set(next)); render(true); toast(msg); } catch(e){ toast(errMsg(e)); }

/* ---- ご要望・お問い合わせ（アプリの中から運営者に送る） ----
   requests/<利用者ID> = {items:[{id, type, text, at, name}], name, updatedAt}（本人と運営者だけが読める）
   replies/<利用者ID>  = {items:{<要望のID>:{seen, reply, at}}, updatedAt}（運営者の確認・返信。本人と運営者だけが読める） */
const REQ_TYPES = [['want', 'こうして欲しい（要望）'], ['bug', 'うまく動かない（不具合）'], ['ask', '使い方の質問'], ['other', 'そのほか']];
const REQ_LS = 'careerquest.requests.v1', REP_LS = 'careerquest.replies.v1';
const REQ_MAX_DAY = 5;
function reqTypeL(k){ return (REQ_TYPES.find(x => x[0] === k) || ['', 'そのほか'])[1]; }
function reqItemsOf(doc){ return doc && Array.isArray(doc.items) ? doc.items.filter(it => it && it.id) : []; }
function repMapOf(doc){ return doc && doc.items && typeof doc.items === 'object' ? doc.items : {}; }
function myReqs(){ return reqItemsOf(S.myReq).slice().sort((a, b) => (b.at || 0) - (a.at || 0)); }
function loadReqLocal(){
  try { S.myReq = JSON.parse(localStorage.getItem(REQ_LS) || 'null'); } catch(e){ S.myReq = null; }
  try { S.myRep = JSON.parse(localStorage.getItem(REP_LS) || 'null'); } catch(e){ S.myRep = null; }
}
function watchRequests(db, uid, owner){
  try { S.unsubs.push(db.collection('requests').doc(uid).onSnapshot(snap => { S.myReq = snap.exists ? snap.data() : null; if (S.meLoaded && S.tab === 'me' && !S.meDirty) render(); }, () => {})); } catch(e){}
  try { S.unsubs.push(db.collection('replies').doc(uid).onSnapshot(snap => { S.myRep = snap.exists ? snap.data() : null; if (S.meLoaded && S.tab === 'me' && !S.meDirty) render(); }, () => {})); } catch(e){}
  if (!owner) return;
  try { S.unsubs.push(db.collection('requests').limit(1000).onSnapshot(snap => { S.requests = snap.docs.map(d => Object.assign({uid:d.id}, d.data())); ownRefresh(); if (S.meLoaded && S.tab === 'me' && !S.meDirty) render(); }, () => {})); } catch(e){}
  try { S.unsubs.push(db.collection('replies').limit(1000).onSnapshot(snap => { S.replies = {}; snap.docs.forEach(d => { S.replies[d.id] = d.data(); }); ownRefresh(); if (S.meLoaded && S.tab === 'me' && !S.meDirty) render(); }, () => {})); } catch(e){}
}

async function submitRequest(){
  if (!S.me || S.readOnly){ toast('送るには、参加の手続きが必要です'); return; }
  const recent = myReqs().filter(it => Date.now() - (it.at || 0) < 864e5).length;
  if (recent >= REQ_MAX_DAY){ toast('今日はこれ以上送れません（1日' + REQ_MAX_DAY + '件まで）。急ぎの場合はメールでご連絡ください'); return; }
  const r = await reqDlg(); if (!r) return;
  const item = {id:'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type:r.type, text:r.text, at:Date.now(), name:nameOf(S.me).slice(0, 16)};
  try {
    if (S.mode === 'online'){
      const ref = S.db.collection('requests').doc(S.uid);
      let items = [];
      try { const snap = await ref.get(); if (snap.exists) items = reqItemsOf(snap.data()); } catch(e){}
      const next = {items:items.concat([item]).slice(-100), name:nameOf(S.me).slice(0, 16), updatedAt:Date.now()};
      await enqueue(() => ref.set(next)); S.myReq = next;
    } else {
      const next = {items:reqItemsOf(S.myReq).concat([item]).slice(-100), name:nameOf(S.me), updatedAt:Date.now()};
      S.myReq = next; try { localStorage.setItem(REQ_LS, JSON.stringify(next)); } catch(e){}
    }
    render(true);
    toast(S.mode === 'online' ? '送りました。運営者が確認します' : 'この端末に保存しました。運営者に届けるにはメールで送ってください');
  } catch(e){ toast(errMsg(e)); }
}

/* ---- 運営者メニュー（オーナーだけ）：ユーザーの情報・要望・通報 ---- */

  const out = [];
  (S.requests || []).forEach(d => reqItemsOf(d).forEach(it => out.push(Object.assign({uid:d.uid, uname:d.name || ''}, it))));

}
function repOf(uid, id){ return repMapOf((S.replies || {})[uid])[id] || {}; }
function openReqCount(){ return allReqItems().filter(it => !repOf(it.uid, it.id).seen).length; }
function openFlagCount(){ const m = modOf(); return reportItems().filter(it => m.resolved.indexOf(it.id) < 0).length; }

function ownSummaryHtml(){
  const ps = realPlayers(), now = Date.now();
  const act7 = ps.filter(p => now - (p.updatedAt || 0) < 7 * 864e5).length;
  const new30 = ps.filter(p => now - (p.joinedAt || 0) < 30 * 864e5).length;
  const scout = ps.filter(p => p.scout).length;
  const ages = ps.map(ageOf).filter(Boolean);

/* ---- アカウント削除 ---- */
async function deleteAccount(){
  if (!S.me || S.readOnly) return;
  const ok = await confirmDlg('アカウントを削除しますか？ニックネーム・診断の回答・任務・達成の報告・ポイント・ブロックの設定など、すべてのデータが消えます。元に戻すことはできません。', 'すべて削除する');
  if (!ok) return;
  toast('削除しています…');
  try {
    if (S.mode === 'online'){
      const uid = S.uid, db = S.db;
      S.unsubs.forEach(u => { try { u(); } catch(e){} }); S.unsubs = [];
      const assets = await useCap('assets');
      for (let round = 0; round < 40; round++){
        const snap = await db.doc('players/' + uid).collection('log').limit(200).get();
        if (!snap.docs.length) break;
        for (const d of snap.docs){
          const l = d.data() || {};
          if (assets && safeAsset(l.photo)){ try { await assets.delete(l.photo.asset); } catch(e){} }
          await db.doc('players/' + uid).collection('log').doc(d.id).delete();
        }
      }
      try { await db.collection('reports').doc(uid).delete(); } catch(e){}
      try { await db.collection('requests').doc(uid).delete(); } catch(e){}
      try { await db.collection('replies').doc(uid).delete(); } catch(e){}
      try { await db.collection('data/users/' + uid).doc('safety').delete(); } catch(e){}
      await db.doc('players/' + uid).delete();
    } else {
      ['careerquest.local.v1', SAFETY_LS, 'careerquest.flags.v1', REQ_LS, REP_LS].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
    }
    S.me = null; S.logs = []; S.safety = null; S.myReq = null; S.myRep = null; S.players = S.players.filter(p => p.id !== S.uid);
    closeSheet(); closePsheet(); S.tab = 'quests'; render(true);
    toast('アカウントとすべてのデータを削除しました');
    if (S.mode === 'online') setTimeout(() => location.reload(), 1200); else openOnboarding(false);
  } catch(e){ toast('削除の途中でエラーになりました。もう一度お試しください。解決しない場合は ' + CONTACT_EMAIL + ' へご連絡ください。'); }
}

let toastT = null, toastFn = null;
function toast(msg, act, fn){
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (act ? '<button type="button" class="toast-act" data-act="toast-act">' + esc(act) + '</button>' : '');
  toastFn = act ? fn : null; t.hidden = false; clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; toastFn = null; }, act ? 6000 : 3200);
}
function confirmDlg(msg, okLabel){
  return new Promise(res => {
    const el = $('#dlg');
    el.innerHTML = '<div class="dlg-card" role="alertdialog" aria-modal="true" aria-labelledby="dlg-m"><p id="dlg-m">' + esc(msg) + '</p><div class="dlg-btns"><button type="button" class="btn-ghost" id="dlg-no">やめる</button><button type="button" class="btn-primary" id="dlg-ok">' + esc(okLabel || 'OK') + '</button></div></div>';
    el.hidden = false;
    const done = v => { el.hidden = true; el.innerHTML = ''; res(v); };
    $('#dlg-no').onclick = () => done(false); $('#dlg-ok').onclick = () => done(true);
    setTimeout(() => { try { $('#dlg-no').focus(); } catch(e){} }, 30);
  });
}
async function deleteLog(id){
  const l = S.logs.find(x => x.id === id); if (!l) return;
  const ok = await confirmDlg('「' + (l.title || '任務') + '」の報告を取り消しますか？獲得した' + fmt(l.pts) + 'ptも減ります。', '取り消す');
  if (!ok) return;
  try {
    await removeLog(id);
    const rest = S.logs.filter(x => x.id !== id);
    S.logs = rest;
    await saveMe(Object.assign({}, S.me, computeStats(rest), {updatedAt: Date.now()}));
    if (S.mode === 'online' && safeAsset(l.photo)){ const assets = await useCap('assets'); if (assets){ try { await assets.delete(l.photo.asset); } catch(e){} } }
    render(); toast('報告を取り消しました');
  } catch(e){ toast(errMsg(e)); }
}

  else if (a === 'cg-repick'){ S.cg.E = null; S.cg.an = null; cgPickRender(); }
  else if (a === 'cg-set') cgSet(t.getAttribute('data-k'), t.getAttribute('data-v'));
  else if (a === 'cg-sub') cgSubToggle(t.getAttribute('data-v'));
  else if (a === 'cg-sub-add') cgSubAdd();
  else if (a === 'cg-at' && S.cg && S.cg.E){ const G = S.cg; if (t.getAttribute('data-v') === 'on'){ const k = G.E.k + (G.E.vp || ''); G.ch.at = /(朝|起き)/.test(k) ? 420 : /(夜|寝)/.test(k) ? 1320 : 1200; G.ch.tr = ''; } else G.ch.at = null; cgSubRender(); cgMoreRender(); cgPickUpdate(); }
  else if (a === 'cg-how' && S.cg && S.cg.E){ const G = S.cg, v = t.getAttribute('data-v'); G.ch.how = G.ch.how === v ? '' : v; cgSubRender(); cgPickUpdate(); }
  else if (a === 'pl-open' && S.cg){ const tt = t.getAttribute('data-t'); S.cg.planOpen = S.cg.planOpen === tt ? null : tt; cgPlanRefresh(); const b = document.querySelector('[data-act="pl-open"][data-t="' + tt + '"]'); if (b) b.focus(); }
  else if (a === 'pl-act' && S.cg){ const tt = t.getAttribute('data-t'), c = (S.cg.planCands[tt] || [])[Number(t.getAttribute('data-i'))]; if (c && !c.cur){ const s2 = cgApplyOv(c.E, cgDefaults(c.E), c.ov || {}, tt); if (s2){ S.cg.planQ[tt] = ''; cgPlanSet(tt, c.E, s2, false); } } }
  else if (a === 'pl-set' && S.cg && S.cg.plan){ const tt = t.getAttribute('data-t'), r = S.cg.plan.rungs[tt]; if (r && !r.me){ const k = t.getAttribute('data-k'), v = t.getAttribute('data-v'); const s2 = Object.assign({}, r.sel); s2[k] = ['lim', 'win', 'lv'].indexOf(k) >= 0 ? Number(v) : v; cgFix(r.E, s2); cgPlanSet(tt, r.E, s2, true); } }
  else if (a === 'pl-reset' && S.cg){ const tt = t.getAttribute('data-t'); delete S.cg.planEdit[tt]; cgPlanRefresh(); }
  else if (a === 'cg-ch') cgChip(t.getAttribute('data-k'), t.getAttribute('data-v'));
  else if (a === 'cg-more'){ S.cg.more = !S.cg.more; cgMoreRender(); }
  else if (a === 'cg-purp'){ const pi = $('#cg-purpose'); if (pi){ pi.value = t.getAttribute('data-v'); cgRender(); } }
  else if (a === 'cg-rename'){ S.cg.nameEdited = false; cgPickUpdate(); }
  else if (a === 'cg-genre'){ S.cg.genre = t.getAttribute('data-v'); S.cg.manual.genre = true; cgRender(); }
  else if (a === 'cg-tier'){ S.cg.tier = t.getAttribute('data-v'); S.cg.manual.tier = true; if (S.cg.mode === 'free') cgUpdate(); else cgRender(); }
  else if (a === 'cg-ax'){ const k = t.getAttribute('data-k'); S.cg.ax[k] = Number(t.getAttribute('data-v')); S.cg.manual[k] = true; cgRender(); }
  else if (a === 'cg-auto'){ S.cg.manual = {}; if (S.cg.mode === 'pick') cgPickUpdate(); else cgUpdate(); }
  else if (a === 'cg-save') saveCustom();
  else if (a === 'q-del') deleteQuest(t.getAttribute('data-q'));
  else if (a === 'q-edit') openEdit(t.getAttribute('data-q'));
  else if (a === 'q-restore'){ const P0 = POOL_BY_ID[t.getAttribute('data-q')]; if (P0) restoreQuests([{kind:'pool', id:P0.id, tier:P0.tier}], '任務を戻しました'); }
  else if (a === 'chain-del') deleteChain(t.getAttribute('data-c'));
  else if (a === 'chain-add') chainAdd(t.getAttribute('data-tag'));
  else if (a === 'toast-act'){ const f = toastFn; toastFn = null; clearTimeout(toastT); $('#toast').hidden = true; if (f) f(); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'ob-name' && S.ob){ S.ob.name = e.target.value; const b = $('#ob-name-next'); if (b) b.disabled = !e.target.value.trim(); }
  else if (id === 'ev-did' || id === 'ev-learn') checkReport();
  else if (id === 'cg-text') cgUpdate();
  else if (id === 'ag-age') agreeCheck();
  else if (id === 'cg-purpose') cgRender();
  else if (id === 'cg-q' && S.cg){ S.cg.q = e.target.value || ''; cgCatsRender(); cgListRender(); }
  else if (id === 'cg-name' && S.cg){ S.cg.nameEdited = true; $('#cg-rename').hidden = false; cgRender(); }
  else if (e.target.hasAttribute && e.target.hasAttribute('data-plsearch') && S.cg){ const tt = e.target.getAttribute('data-plsearch'); S.cg.planQ[tt] = e.target.value; const c = $('#pl-c-' + tt); if (c) c.innerHTML = cgRungCandHtml(tt); }
  else if (e.target.hasAttribute && e.target.hasAttribute('data-plname') && S.cg && S.cg.plan){ const tt = e.target.getAttribute('data-plname'), r = S.cg.plan.rungs[tt]; if (r && !r.me){ const v = e.target.value.slice(0, 60); const b = $('#pl-t-' + tt); if (b) b.textContent = v.trim() || cgTitle(r.E, r.sel, {}); } }
  else if (id === 'cg-how-in' && S.cg && S.cg.E){ const v = e.target.value.trim().slice(0, 20); if (v && ngCheck(v)) return; S.cg.ch.how = v; document.querySelectorAll('#cg-sub [data-act="cg-how"]').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v))); cgPickUpdate(); }
  else if (id === 'own-q' && S.own){ S.own.q = e.target.value; const l = $('#own-list'); if (l) l.innerHTML = ownUserListHtml(); }
  else if (e.target.closest && e.target.closest('#me-form')) S.meDirty = true;
});
document.addEventListener('change', e => {
  if (e.target.hasAttribute && e.target.hasAttribute('data-plan') && S.cg){ S.cg.planOff[e.target.getAttribute('data-plan')] = !e.target.checked; cgSaveLabel(); return; }
  if (e.target.hasAttribute && e.target.hasAttribute('data-plname') && S.cg && S.cg.plan){
    const tt = e.target.getAttribute('data-plname'), r = S.cg.plan.rungs[tt]; if (!r || r.me) return;
    const v = e.target.value.trim().slice(0, 60);
    if (v && ngCheck(v)){ toast(ngMsg(ngCheck(v))); e.target.value = r.name || ''; return; }
    // 描き直さずに残す（「できた」をそのまま押せるように）。保存の前に判定し直す
    S.cg.planEdit[tt] = {n:r.E.n, sel:Object.assign({}, r.sel), name:v}; r.name = v; r.edited = true; r.title = (v || cgTitle(r.E, r.sel, {})).slice(0, 60); return;
  }
  if (e.target.id === 'g-off'){ setGuideOff(e.target.checked); return; }
  if (e.target.id === 'ag-age' || e.target.id === 'ag-terms'){ agreeCheck(); return; }
  if (e.target.id === 'set-guide'){ setGuideOff(!e.target.checked); toast(e.target.checked ? '起動したときに使い方を表示します' : '起動したときに使い方を表示しません'); return; }
  else if (e.target.id === 'set-scout') S.meDirty = true;
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'me-form') return;
  e.preventDefault(); if (!S.me || S.readOnly) return;
  const name = $('#set-name').value.trim().slice(0, 16);
  if (!name){ toast('ニックネームを入力してください'); return; }
  if (ngCheck(name)){ toast(ngMsg(ngCheck(name))); return; }
  const ageIn = parseAge(($('#set-age') || {}).value);
  if (ageIn && (ageIn < AGE_MIN || ageIn > AGE_MAX)){ toast(ageIn < AGE_MIN ? 'このアプリは18歳以上の方が対象です' : '年齢をもう一度確認してください'); return; }
  const agePatch = ageIn && ageIn !== ageOf(S.me) ? {age:ageIn, ageAt:Date.now()} : {};
  const sel = document.querySelector('#set-av button.sel');
  try {
    await saveMe(Object.assign({}, S.me, {name, avatar: sel ? sel.getAttribute('data-av') : S.me.avatar, scout: $('#set-scout').checked, updatedAt: Date.now()}, agePatch));
    S.meDirty = false; render(true); toast('プロフィールを保存しました');
  } catch(err){ toast(errMsg(err)); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'cg-sub-in'){ e.preventDefault(); cgSubAdd(); return; }
  if (e.key !== 'Escape') return;
  if (!$('#dlg').hidden) return;
  if (!$('#docv').hidden){ closeDoc(); return; }
  if (!$('#lb').hidden){ $('#lb').hidden = true; return; }
  if (!$('#cele').hidden){ $('#cele').hidden = true; return; }
  if (!$('#psheet').hidden){ closePsheet(); return; }
  if (!$('#sheet').hidden && !(S.rep && S.rep.busy)) closeSheet();
});
document.addEventListener('error', e => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG') return;
  const fb = t.getAttribute('data-fb');
  if (fb && t.getAttribute('src') !== fb){ t.setAttribute('src', fb); }
}, true);

/* ---------- 起動 ---------- */
try {
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
} catch(e){ start({}); }
})();
</script>
</body>
</html>
